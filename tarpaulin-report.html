ather-rs","src","lib","domain","config","adaptor_config.rs"],"content":"/// A single configuration field exposed by an adaptor for startup logging.\npub struct AdaptorConfigField {\n    /// Field name (e.g. `hostname`, `conn_string`).\n    pub key: \u0026'static str,\n    /// Current effective value.\n    pub value: String,\n    /// Whether the value is sensitive (secrets/credentials) and must be\n    /// withheld from default (info) startup logs.\n    pub sensitive: bool,\n}\n\nimpl AdaptorConfigField {\n    /// Build a non-sensitive field.\n    pub fn new(key: \u0026'static str, value: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            key,\n            value: value.into(),\n            sensitive: false,\n        }\n    }\n\n    /// Build a sensitive field (e.g. api key, jwt key, connection string).\n    ///\n    /// The supplied `value` should already be a safe-to-log representation\n    /// (typically a masked form from the field's `Display`). Sensitive fields\n    /// are withheld from `info` logs and only emitted at `trace`, where this\n    /// masked value is still used — the real secret never enters the logs.\n    pub fn secret(key: \u0026'static str, value: impl Into\u003cString\u003e) -\u003e Self {\n        Self {\n            key,\n            value: value.into(),\n            sensitive: true,\n        }\n    }\n}\n\n/// A generic, adaptor-driven representation of an adaptor's configuration.\n///\n/// Each adaptor implements this for its *own* internal config type so that the\n/// config service can log whatever the adaptor dictates — without the adaptor\n/// and the config layer sharing a concrete config struct. This keeps adaptors\n/// free to diverge (e.g. MySQL vs MongoDB connection settings).\npub trait AdaptorConfigRepr {\n    /// Return this adaptor's name, used as a structured log field (e.g. `axum`).\n    fn adaptor_name(\u0026self) -\u003e \u0026'static str;\n\n    /// Return this adaptor's configuration as a list of fields for logging.\n    fn config_fields(\u0026self) -\u003e Vec\u003cAdaptorConfigField\u003e;\n}\n","traces":[{"line":14,"address":[17616688],"length":1,"stats":{"Line":0}},{"line":17,"address":[17616722],"length":1,"stats":{"Line":0}},{"line":28,"address":[17616848],"length":1,"stats":{"Line":0}},{"line":31,"address":[17616882],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":4},{"path":["/","home","shyuen","local_repos","personal","eas-weather-rs","src","lib","domain","config","issue.rs"],"content":"//! Configuration validation issues collected by domain models during\n//! auto-correction. Models collect and return these; the config service is\n//! responsible for rendering/emitting them as log events.\n\n/// A validation issue detected while auto-correcting a raw configuration value.\n///\n/// Each variant carries the structured data needed to render a distinct\n/// logging message — keeping models free of logging while preserving the\n/// per-issue `config`, `default`, etc. fields for JSON/Splunk consumption.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum ConfigIssue {\n    /// A configuration setting was not provided and a default was used.\n    NotSpecified {\n        /// Canonical `sector.field` key of the setting.\n        key: \u0026'static str,\n        /// The default value used in place of the missing one.\n        default: String,\n    },\n    /// A configuration setting had an invalid value and a default was used.\n    Invalid {\n        /// Canonical `sector.field` key of the setting.\n        key: \u0026'static str,\n        /// The offending value that was rejected.\n        value: String,\n        /// The default value used in place of the invalid one.\n        default: String,\n    },\n    /// A configuration setting failed to load (e.g. reading a secret file).\n    LoadFailed {\n        /// Canonical `sector.field` key of the setting.\n        key: \u0026'static str,\n        /// The path/source that failed to load.\n        path: String,\n        /// The reason the load failed.\n        reason: String,\n        /// The default value used in place of the failed one.\n        default: String,\n    },\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","shyuen","local_repos","personal","eas-weather-rs","src","lib","domain","config","model.rs"],"content":"use serde::{Deserialize, Serialize};\n\n/// The raw configuration for the driver and its components.\n#[derive(Debug, Serialize, Deserialize, Clone)]\npub struct Config {\n    pub logging: ConfigLogging,\n    pub webserver: ConfigWebserver,\n    pub database: ConfigDatabase,\n    pub config_file: Option\u003cString\u003e,\n}\n\n/// The gathered, pre-validation configuration inputs, split by source.\n///\n/// Serialized to JSON values so the domain port stays decoupled from the\n/// adaptor-specific source types (e.g. the figment `Cli`). The config service\n/// decides how to render them (text vs JSON, masking).\n#[derive(Debug, Clone)]\npub struct RawConfigInputs {\n    /// Configuration sourced from CLI arguments.\n    pub cli: serde_json::Value,\n    /// Configuration sourced from environment variables.\n    pub env: serde_json::Value,\n    /// Configuration sourced from config files.\n    pub files: serde_json::Value,\n    /// The final merged raw configuration before validation.\n    pub final_config: serde_json::Value,\n}\n\n/// The raw configuration for logging.\n#[derive(Debug, Serialize, Deserialize, Clone)]\npub struct ConfigLogging {\n    pub format: Option\u003cString\u003e,\n    pub trace_level: Option\u003cString\u003e,\n}\n\n/// The raw configuration for the databse and its components.\n#[derive(Debug, Serialize, Deserialize, Clone)]\npub struct ConfigDatabase {\n    pub conn_url_file: Option\u003cString\u003e,\n    pub conn_max_retries: Option\u003cu8\u003e,\n    pub conn_retry_init_delay_secs: Option\u003cu16\u003e,\n\n    pub conn_acquire_timeout_secs: Option\u003cu16\u003e,\n    pub conn_idle_timeout_secs: Option\u003cu32\u003e,\n    pub conn_max_lifetime_secs: Option\u003cu32\u003e,\n    pub max_connections: Option\u003cu32\u003e,\n    pub min_connections: Option\u003cu32\u003e,\n}\n\n/// The raw configuration for the server and its components.\n#[derive(Debug, Serialize, Deserialize, Clone)]\npub struct ConfigWebserver {\n    pub hostname: Option\u003cString\u003e,\n    pub port: Option\u003cu16\u003e,\n    pub base_path: Option\u003cString\u003e,\n\n    pub shutdown_timeout_secs: Option\u003cu64\u003e,\n\n    pub api_key_file: Option\u003cString\u003e,\n\n    pub jwt_key_file: Option\u003cString\u003e,\n    pub jwt_access_token_expiry_secs: Option\u003cu64\u003e,\n\n    pub default_page_limit: Option\u003cu64\u003e,\n    pub page_limit_max: Option\u003cu64\u003e,\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","shyuen","local_repos","personal","eas-weather-rs","src","lib","domain","config","port.rs"],"content":"use crate::domain::config::issue::ConfigIssue;\nuse crate::domain::config::model::{Config, RawConfigInputs};\nuse crate::domain::database::model::Database;\nuse crate::domain::logging::model::Logging;\nuse crate::domain::webserver::model::Webserver;\n\npub trait ConfigPort: Clone + Send + Sync + 'static {\n    /// Generate and return the application configuration\n    /// Should gather configuration based on the priority order of:\n    /// CLI args \u003e Environment File \u003e Environment Variables \u003e Configuration File \u003e Default Configuration File \u003e Default Values\n    fn new() -\u003e Self;\n\n    /// Get the raw configuration\n    fn get_raw_config(\u0026self) -\u003e \u0026Config;\n\n    /// Get the logging configuration\n    fn get_logging_config(\u0026self) -\u003e \u0026Logging;\n\n    /// Get the database configuration\n    fn get_database_config(\u0026self) -\u003e \u0026Database;\n\n    /// Get the webserver configuration\n    fn get_webserver_config(\u0026self) -\u003e \u0026Webserver;\n\n    /// Gather the raw configuration inputs from each source (CLI, env, files)\n    /// without applying validation or auto-correction. Rendering/logging is\n    /// left to the caller so it can respect the configured output format.\n    fn raw_config_input(\u0026self) -\u003e RawConfigInputs;\n\n    /// Run validation over the effective configuration, collecting the issues\n    /// detected during any auto-correction. Emission into the logs is left to\n    /// the caller (the config service) so the domain models stay logging-free.\n    fn validate_raw_config(\u0026self) -\u003e Vec\u003cConfigIssue\u003e;\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","shyuen","local_repos","personal","eas-weather-rs","src","lib","domain","config","service.rs"],"content":"use tracing::{debug, info, trace, warn};\n\nuse crate::domain::config::adaptor_config::AdaptorConfigRepr;\nuse crate::domain::config::issue::ConfigIssue;\nuse crate::domain::config::model::Config;\nuse crate::domain::config::port::ConfigPort;\nuse crate::domain::database::model::Database;\nuse crate::domain::logging::model::Logging;\nuse crate::domain::logging::new_types::lg_format::LoggingFormatType;\nuse crate::domain::logging::port::LoggingPort;\nuse crate::domain::logging::service::LoggingService;\nuse crate::domain::webserver::model::Webserver;\n\n#[derive(Debug, Clone)]\npub struct ConfigService\u003cC\u003e\nwhere\n    C: ConfigPort,\n{\n    pub port: C,\n}\n\nimpl\u003cC\u003e Default for ConfigService\u003cC\u003e\nwhere\n    C: ConfigPort,\n{\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl\u003cC\u003e ConfigService\u003cC\u003e\nwhere\n    C: ConfigPort,\n{\n    /// Creates a new instance of ConfigService.\n    pub fn new() -\u003e Self {\n        let port = C::new();\n        Self { port }\n    }\n\n    /// Get the Config repository\n    pub fn get_port(\u0026self) -\u003e \u0026C {\n        \u0026self.port\n    }\n\n    /// Log the raw configuration inputs gathered from each source.\n    ///\n    /// Rendering depends on the configured logging format (pretty for text,\n    /// compact JSON for the json format). Emitted at `debug` since the raw,\n    /// pre-correction inputs are only of interest when troubleshooting config\n    /// auto-correction.\n    pub fn log_raw_config_input(\u0026self) {\n        let inputs = self.port.raw_config_input();\n        let pretty = matches!(\n            self.get_logging_config().format.get(),\n            LoggingFormatType::Text\n        );\n        let render = |value: \u0026serde_json::Value| -\u003e String {\n            if pretty {\n                serde_json::to_string_pretty(value).unwrap_or_else(|_| value.to_string())\n            } else {\n                value.to_string()\n            }\n        };\n\n        debug!(source = \"cli\", config = %render(\u0026inputs.cli));\n        debug!(source = \"env\", config = %render(\u0026inputs.env));\n        debug!(source = \"files\", config = %render(\u0026inputs.files));\n        debug!(source = \"final_config\", config = %render(\u0026inputs.final_config));\n    }\n\n    /// Emit the raw configuration through the initialized logging service.\n    ///\n    /// Must be called after [`LoggingService::new`] so tracing is active.\n    /// The `\u0026LoggingService` parameter enforces this ordering at compile time.\n    pub fn emit_raw_config\u003cL\u003e(\u0026self, _logging_service: \u0026LoggingService\u003cL\u003e)\n    where\n        L: LoggingPort,\n    {\n        let raw = serde_json::to_string_pretty(self.get_raw_config())\n            .unwrap_or_else(|_| \"failed to serialize config\".to_string());\n        info!(\"application configuration:\\n{raw}\");\n    }\n\n    /// Returns the raw configuration.\n    pub fn get_raw_config(\u0026self) -\u003e \u0026Config {\n        self.port.get_raw_config()\n    }\n\n    /// Log configuration fields exposed by an adaptor through [`AdaptorConfigRepr`].\n    ///\n    /// Emits one log line per adaptor, so N adaptors produce N lines at startup.\n    /// Rendering depends on the configured logging format:\n    /// - **text** → the fields are pretty-printed JSON, for convenient developer\n    ///   viewing.\n    /// - **json** → the fields are emitted as a compact JSON object, the\n    ///   machine-readable form suitable for log aggregators such as Splunk.\n    ///\n    /// Non-sensitive fields are logged at `info`; sensitive fields\n    /// (secrets/credentials) are withheld from info and only emitted at `trace`,\n    /// and even then in masked form (the adaptor supplies the masked\n    /// representation via its `Display`). Real secret values never enter the\n    /// logs.\n    pub fn log_adaptor_config(\u0026self, adaptor: \u0026impl AdaptorConfigRepr) {\n        let adaptor_name = adaptor.adaptor_name();\n        let mut public = serde_json::Map::new();\n        let mut secrets = serde_json::Map::new();\n        for field in adaptor.config_fields() {\n            let json = serde_json::Value::String(field.value);\n            if field.sensitive {\n                secrets.insert(field.key.to_string(), json);\n            } else {\n                public.insert(field.key.to_string(), json);\n            }\n        }\n\n        let pretty = matches!(\n            self.get_logging_config().format.get(),\n            LoggingFormatType::Text\n        );\n\n        if !public.is_empty() {\n            let config = serde_json::Value::Object(public);\n            if pretty {\n                info!(\n                    adaptor = adaptor_name,\n                    config = %serde_json::to_string_pretty(\u0026config).unwrap_or_else(|_| config.to_string())\n                );\n            } else {\n                info!(adaptor = adaptor_name, config = %config);\n            }\n        }\n        if !secrets.is_empty() {\n            let config = serde_json::Value::Object(secrets);\n            if pretty {\n                trace!(\n                    adaptor = adaptor_name,\n                    conf s"],"content":"use thiserror::Error;\n\nuse crate::domain::config::adaptor_config::AdaptorConfigRepr;\nuse crate::domain::database::model::Database;\n\n/// Errors that can occur while establishing a database connection pool.\n#[derive(Debug, Clone, PartialEq, Eq, Error)]\npub enum DatabaseConnectError {\n    /// A transient failure worth retrying (e.g. the DB is temporarily unreachable).\n    #[error(\"database connect failed (retryable): {0}\")]\n    Retryable(String),\n    /// A permanent failure from which retrying will not recover.\n    #[error(\"database connect failed (fatal): {0}\")]\n    Fatal(String),\n}\n\n/// Errors that can occur while closing a database connection pool.\n#[derive(Debug, Clone, PartialEq, Eq, Error)]\npub enum DatabaseCloseError {\n    /// The pool was never initialized, so there is nothing to close.\n    #[error(\"database pool was not initialized; nothing to close\")]\n    PoolNotInitialized,\n}\n\n//#[async_trait]\npub trait DatabasePort: AdaptorConfigRepr + Clone + Send + Sync + 'static {\n    /// Create a new instance of the database repository with the given configuration\n    fn new(conf: \u0026Database) -\u003e Self;\n\n    /// Create the database connection pool\n    fn create_pool(\u0026mut self) -\u003e impl Future\u003cOutput = Result\u003c(), DatabaseConnectError\u003e\u003e + Send;\n\n    /// Close the database connection pool\n    fn close_pool(\u0026self) -\u003e impl Future\u003cOutput = Result\u003c(), DatabaseCloseError\u003e\u003e + Send;\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","shyuen","local_repos","personal","eas-weather-rs","src","lib","domain","database","service.rs"],"content":"use crate::domain::alert::port::AlertPort;\nuse crate::domain::config::port::ConfigPort;\nuse crate::domain::config::service::ConfigService;\nuse crate::domain::database::model::Database;\nuse crate::domain::database::port::{DatabaseCloseError, DatabaseConnectError, DatabasePort};\nuse tracing::{debug, error, info, warn};\n\n#[derive(Debug, Clone)]\npub struct DatabaseService\u003cD\u003e\nwhere\n    D: DatabasePort + AlertPort,\n{\n    db_port: D,\n    conf: Database,\n}\n\nimpl\u003cD\u003e DatabaseService\u003cD\u003e\nwhere\n    D: DatabasePort + AlertPort,\n{\n    /// Creates a new instance of DatabaseService.\n    pub fn new\u003cC\u003e(conf_serv: \u0026ConfigService\u003cC\u003e) -\u003e Self\n    where\n        C: ConfigPort,\n    {\n        let conf = conf_serv.get_database_config().clone();\n        let db_port = D::new(\u0026conf);\n        Self { db_port, conf }\n    }\n\n    /// Get the Database port\n    pub fn get_port(\u0026self) -\u003e \u0026D {\n        \u0026self.db_port\n    }\n\n    pub async fn create_pool(\u0026mut self) -\u003e Result\u003c(), DatabaseConnectError\u003e {\n        let max_retries = self.conf.conn_max_retries.get();\n        let mut current_backoff = self.conf.conn_retry_init_delay_secs.get();\n\n        debug!(\n            \"create_pool: creating database connection pool (max_retries={})\",\n            max_retries\n        );\n\n        for attempt in 1..=max_retries {\n            match self.db_port.create_pool().await {\n                Ok(()) =\u003e {\n                    info!(\n                        attempt,\n                        \"create_pool: database connection pool created successfully\"\n                    );\n                    return Ok(());\n                }\n                Err(DatabaseConnectError::Fatal(msg)) =\u003e {\n                    error!(attempt, error = %msg, \"create_pool: fatal error; aborting\");\n                    return Err(DatabaseConnectError::Fatal(msg));\n                }\n                Err(DatabaseConnectError::Retryable(msg)) =\u003e {\n                    if attempt == max_retries {\n                        error!(\n                            attempt,\n                            max_retries,\n                            error = %msg,\n                            \"create_pool: one();\n    }\n\n    serializer.serialize_str(\u0026conn_string.to_string())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use serde::Serialize;\n\n    #[derive(Serialize)]\n    struct Wrapper\u003c'a\u003e {\n        #[serde(serialize_with = \"serialize_with_display\")]\n        value: \u0026'a Wrapped,\n    }\n\n    #[derive(Debug)]\n    enum Wrapped {\n        Some(String),\n        None,\n    }\n\n    impl std::fmt::Display for Wrapped {\n        fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n            match self {\n                Wrapped::Some(s) =\u003e write!(f, \"{}\", s),\n                Wrapped::None =\u003e write!(f, \"None\"),\n            }\n        }\n    }\n\n    #[test]\n    fn test_capitalize_first_lowercase_rest() {\n        assert_eq!(\n            capitalize_first_lowercase_rest(\"hELLo WORld\"),\n            \"Hello world\"\n        );\n        assert_eq!(capitalize_first_lowercase_rest(\"RUST\"), \"Rust\");\n        assert_eq!(capitalize_first_lowercase_rest(\"rust\"), \"Rust\");\n        assert_eq!(capitalize_first_lowercase_rest(\"r\"), \"R\");\n        assert_eq!(capitalize_first_lowercase_rest(\"\"), \"\");\n    }\n\n    #[test]\n    fn serialize_with_display_writes_display_string() {\n        let wrapped = Wrapped::Some(\"mysql://user@db/app\".to_string());\n        let json = serde_json::to_string(\u0026Wrapper { value: \u0026wrapped }).unwrap();\n        assert_eq!(json, r#\"{\"value\":\"mysql://user@db/app\"}\"#);\n    }\n\n    #[test]\n    fn serialize_with_display_maps_none_to_null() {\n        let wrapped = Wrapped::None;\n        let json = serde_json::to_string(\u0026Wrapper { value: \u0026wrapped }).unwrap();\n        assert_eq!(json, r#\"{\"value\":null}\"#);\n    }\n}\n","traces":[{"line":1,"address":[16431216,16431539,16431545],"length":1,"stats":{"Line":2}},{"line":3,"address":[17918897],"length":1,"stats":{"Line":2}},{"line":6,"address":[17918921,17918989],"length" \n            .collect();\n        assert_eq!(\n            keys,\n            vec![\n                \"webserver.hostname\",\n                \"webserver.port\",\n                \"webserver.base_path\",\n                \"webserver.shutdown_timeout_secs\",\n                \"webserver.api_key\",\n                \"webserver.jwt_key\",\n                \"webserver.jwt_access_token_expiry_secs\",\n                \"webserver.default_page_limit\",\n                \"webserver.page_limit_max\",\n            ]\n        );\n    }\n\n    #[test]\n    fn validate_flags_unloadable_api_key_file() {\n        let (_, jwt_key) = loadable_secret_files();\n        let issues = Webserver::new(\u0026empty()).validate_raw_config(\u0026raw(\n            Some(\"localhost\"),\n            Some(8080),\n            Some(\"/api\"),\n            Some(5),\n            Some(\"/nonexistent/api.key\"),\n            Some(jwt_key.path().to_str().unwrap()),\n            Some(3600),\n            Some(10),\n            Some(50),\n        ));\n        let load_failed: Vec\u003c_\u003e = issues\n            .iter()\n            .filter_map(|issue| match issue {\n                ConfigIssue::LoadFailed { key, .. } =\u003e Some(*key),\n                _ =\u003e None,\n            })\n            .collect();\n        assert_eq!(load_failed, vec![\"webserver.api_key\"]);\n    }\n\n    #[test]\n    fn validate_flags_unloadable_jwt_key_file() {\n        let (api_key, _) = loadable_secret_files();\n        let issues = Webserver::new(\u0026empty()).validate_raw_config(\u0026raw(\n            Some(\"localhost\"),\n            Some(8080),\n            Some(\"/api\"),\n            Some(5),\n            Some(api_key.path().to_str().unwrap()),\n            Some(\"/nonexistent/jwt.key\"),\n            Some(3600),\n            Some(10),\n            Some(50),\n        ));\n        let load_failed: Vec\u003c_\u003e = issues\n            .iter()\n            .filter_map(|issue| match issue {\n                Config     <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/').map(decodeURIComponent);
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      const nbHit = covered? trace.stats.Line: 0;
      return e(
        'div',
        { className: 'code-text-container' },
        e(
          'code',
          {
            className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          },
          line
        ),
        e(
          'div',
          { className: 'cover-indicator' + (covered? ' check-cover': '') + (uncovered? ' no-cover': '')},
          e(
            'div',
            { className: (covered? 'stat-line-hit': '')},
            covered? nbHit: ""
          )
        )
      );
    }),
  );
}

(function () {
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData &&
    previousData.files.forEach(file => {
      const path = file.path.slice(commonPath.length).join('/');
      prevFilesMap.set(path, file);
    });

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    const {covered = 0, coverable = 0} = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: {covered, coverable},
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
</script>
