<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

:model::{Config, RawConfigInputs};\nuse crate::domain::config::port::ConfigPort;\nuse crate::domain::database::model::Database;\nuse crate::domain::logging::model::Logging;\nuse crate::domain::webserver::model::Webserver;\n\n#[derive(Debug, Clone)]\npub struct ConfigFigment {\n    conf_raw: Config,\n    conf_logging: Logging,\n    conf_database: Database,\n    conf_webserver: Webserver,\n}\n\nfn collect_raw_input() -\u003e Config {\n    // This line loads the environment variables from the \".env\" file.\n    dotenv().ok();\n\n    // Use Figment to load preliminary configuration\n    // We need this to handle the certain configuration options such as using a\n    // different configuration file to load when dictated by the CLI or ENV.\n    let conf: Config = match Figment::new()\n        .join(Serialized::defaults(Cli::parse()))\n        .join(Env::prefixed(\"APP__\").split(\"__\"))\n        .extract()\n    {\n        Ok(c) =\u003e c,\n        Err(e) =\u003e {\n            eprintln!(\"error extracting configuration: {}\", e);\n            std::process::exit(1); // We use exit for planned exits instead of panics\n        }\n    };\n\n    // Check which selected config file to load from CLI or ENV\n    let config_file = match conf.config_file {\n        Some(x) =\u003e x.to_string(),\n        None =\u003e \"config/config.toml\".to_string(),\n    };\n\n    // Use Figment to load configuration from multiple sources the following priority\n    // CLI \u003e ENV \u003e FILE \u003e DEFAULT FILE \u003e CODE\n    let conf: Config = match Figment::new()\n        .join(Serialized::defaults(Cli::parse()))\n        .join(Env::prefixed(\"LOGGING__\").split(\"__\"))\n        .join(Env::prefixed(\"SERVER__\").split(\"__\"))\n        .join(Env::prefixed(\"DATABASE__\").split(\"__\"))\n        .join(Toml::file(config_file))\n        .join(Toml::file(\"./config/default.toml\"))\n        .extract()\n    {\n        Ok(c) =\u003e c,\n        Err(e) =\u003e {\n            eprintln!(\"error extracting configuration: {}\", e);\n            std::process::exit(1);\n        }\n    };\n\n    conf\n}\n\nimpl ConfigPort for ConfigFigment {\n    fn new() -\u003e Self {\n        let conf = collect_raw_input();\n        Self {\n            conf_raw: conf.clone(),\n            conf_logging: Logging::new(\u0026conf.logging),\n            conf_database: Database::new(\u0026conf.database),\n            conf_webserver: Webserver::new(\u0026conf.webserver),\n        }\n    }\n\n    /// Get the raw configuration\n    fn get_raw_config(\u0026self) -\u003e \u0026Config {\n        \u0026self.conf_raw\n    }\n\n    /// Get the logging configuration\n    fn get_logging_config(\u0026self) -\u003e \u0026Logging {\n        \u0026self.conf_logging\n    }\n\n    /// Get the database configuration\n    fn get_database_config(\u0026self) -\u003e \u0026Database {\n        \u0026self.conf_database\n    }\n\n    /// Get the webserver configuration\n    fn get_webserver_config(\u0026self) -\u003e \u0026Webserver {\n        \u0026self.conf_webserver\n    }\n\n    // Gather raw config input from each source without validation\n    fn raw_config_input(\u0026self) -\u003e RawConfigInputs {\n        // Gather config from CLI\n        let cli = serde_json::to_value(Cli::parse()).unwrap_or(serde_json::Value::Null);\n\n        // Gather config from ENV\n        let env = serde_json::to_value(\n            env::vars()\n                .filter(|(k, _)| {\n                    k.starts_with(\"LOGGING__\")\n                        || k.starts_with(\"SERVER__\")\n                        || k.starts_with(\"DATABASE__\")\n                })\n                .map(|(k, v)| (k.replace(\"__\", \".\"), v))\n                .collect::\u003cVec\u003c_\u003e\u003e(),\n        )\n        .unwrap_or(serde_json::Value::Null);\n\n        // Gather config from files\n        let files: Config = match Figment::new()\n            .join(Toml::file(\n                self.conf_raw\n                    .config_file\n                    .clone()\n                    .unwrap_or(\"config/config.toml\".to_string()),\n            ))\n            .join(Toml::file(\"./config/default.toml\"))\n            .extract()\n        {\n            Ok(c) =\u003e c,\n            Err(e) =\u003e {\n                eprintln!(\"error extracting configuration: {}\", e);\n                std::process::exit(1);\n            }\n        };\n        let files = serde_json::to_value(files).unwrap_or(serde_json::Value::Null);\n\n        // Final merged raw config before validation\n        let final_config = serde_json::to_value(\u0026self.conf_raw).unwrap_or(serde_json::Value::Null);\n\n        RawConfigInputs {\n            cli,\n            env,\n            files,\n            final_config,\n        }\n    }\n\n    /// Run validation over the effective configuration, collecting detected issues\n    fn validate_raw_config(\u0026self) -\u003e Vec\u003cConfigIssue\u003e {\n        let mut issues = Vec::new();\n        issues.extend(\n            self.conf_logging\n                .validate_raw_config(\u0026self.conf_raw.logging),\n        );\n        issues.extend(\n            self.conf_database\n                .validate_raw_config(\u0026self.conf_raw.database),\n        );\n        issues.extend(\n            self.conf_webserver\n                .validate_raw_config(\u0026self.conf_raw.webserver),\n        );\n        issues\n    }\n}\n","traces":[{"line":25,"address":[17911647,17911653,17909072],"length":1,"stats":{"Line":0}},{"line":27,"address":[15920544],"length":1,"stats":{"Line":0}},{"line":32,"address":[17909366,17909247,17909672,17909543],"length":1,"stats":{"Line":0}},{"line":33,"address":[17909291,17912215,17909374,17909272],"length":1,"stats":{"Line":0}},{"line":34,"address":[17909463,17909432,17912193,17909551],"length":1,"stats":{"Line":0}},{"line":35,"address":[17909601],"length":1,"stats":{"Line":0}},{"line":37,"address":[17909756],"length":1,"stats":{"Line":0}},{"line":38,"address":[1790 conf_webserv: \u0026Webserver) -\u003e Self {\n        WebserverPoem::new(conf_webserv.clone())\n    }\n\n    //async fn start_server\u003c'a\u003e(\n    async fn start_server\u003cD\u003e(\n        \u0026self,\n        config: \u0026Webserver,\n        alert_service: \u0026AlertService\u003cD\u003e,\n        meta_serv: \u0026impl MetaPort,\n    ) -\u003e Result\u003cShutdownReason, std::io::Error\u003e\n    where\n        D: DatabasePort + AlertPort,\n    {\n        // Construct root address\n        let root_addr = format!(\"{}:{}\", config.hostname.get(), config.port.get());\n\n        // Check the base_path value\n        let base_path: \u0026str = match \u0026config.base_path.get() {\n            Some(base_path) =\u003e {\n                let mut clean_base_path = base_path.to_string();\n\n                // Ensure it begins with `/`\n                if !base_path.starts_with(\"/\") {\n                    clean_base_path = \"/\".to_string() + \u0026clean_base_path;\n                };\n\n                \u0026clean_base_path.to_string()\n            }\n            None =\u003e \"/\",\n        };\n\n        // Construct base address for OpenAPI server\n        let base_addr = format!(\"{}{}\", root_addr, base_path);\n\n        // Configure OpenAPI service\n        let main_paths = OpenApiService::new(\n            MetaHandler,\n            env!(\"CARGO_PKG_NAME\").to_string(),\n            env!(\"CARGO_PKG_VERSION\").to_string(),\n        )\n        .server(format!(\"http://{}\", base_addr));\n\n        // Create Swagger UI\n        let ui = main_paths.swagger_ui();\n\n        // Construct dependencies to inject into handlers.\n        let app_state = AppState {\n            meta: Arc::new(meta_serv.clone()),\n            moose: \"string\".to_string(),\n        };\n\n        // Create routes\n        let routes = Route::new()\n            .nest(\"/\", main_paths)\n            .nest(format!(\"{}/docs\", base_path), ui)\n            .data(app_state.clone()); // Pass meta_service to the routes, requires EndpointExt\n\n        // Database port for graceful shutdown is sourced from the alert service.\n        let db_port = alert_service.get_db_port().clone();\n\n        // Channel so the shutdown future can report why we stopped.\n        let (shutdown_tx, shutdown_rx) = oneshot::channel::\u003cShutdownReason\u003e();\n\n        // Start the server with graceful shutdown\n        Server::new(TcpListener::bind(format!(\n            \"{}:{}\",\n            config.hostname.get(),\n            config.port.get()\n        )))\n        .run_with_graceful_shutdown(\n            routes,\n            async move {\n                let _ = tokio::signal::ctrl_c().await;\n                let _ = shutdown_tx.send(ShutdownReason::CtrlC);\n\n                // Perform any necessary cleanup here\n                // e.g., close database connections, flush logs, etc.\n                let _ = db_port.close_pool().await;\n            },\n            // Graceful shutdown timeout\n            Some(Duration::from_secs(config.shutdown_timeout_secs.get())),\n        )\n        .await?;\n\n        Ok(shutdown_rx.await.unwrap_or(ShutdownReason::Stopped))\n    }\n}\n\nimpl AdaptorConfigRepr for WebserverPoem {\n    fn adaptor_name(\u0026self) -\u003e \u0026'static str {\n        \"poem\"\n    }\n\n    fn config_fields(\u0026self) -\u003e Vec\u003cAdaptorConfigField\u003e {\n        let c = \u0026self.config;\n        vec![\n            AdaptorConfigField::new(\"hostname\", c.hostname.get().clone()),\n            AdaptorConfigField::new(\"port\", c.port.get().to_string()),\n            AdaptorConfigField::new(\"base_path\", c.base_path.to_string()),\n            AdaptorConfigField::new(\n                \"shutdown_timeout_secs\",\n                c.shutdown_timeout_secs.get().to_string(),\n            ),\n            AdaptorConfigField::secret(\"api_key\", c.api_key.to_string()),\n            AdaptorConfigField::secret(\"jwt_key\", c.jwt_key.to_string()),\n alEq,\n    Eq,\n    PartialOrd,\n    Ord,\n    Hash,\n    serde::Serialize,\n    serde::Deserialize,\n    sqlx::Type,\n)]\npub struct MySqlAlert {\n    pub identifier: String,\n    pub sender: String,\n    //pub sent: String,\n    #[serde(with = \"my_iso8601_format\")]\n    pub sent: OffsetDateTime,\n    pub status: String,\n    pub msgtype: String,\n    pub source: Option\u003cString\u003e,\n    pub scope: String,\n    pub references: Option\u003cString\u003e,\n}\n\nimpl AlertPort for DatabaseMySql {\n    async fn get_daily_alerts_data(\n        \u0026self,\n        limit: u64,\n        offset: u64,\n    ) -\u003e Result\u003cGetDailyAlertsResponse, GetDailyAlertsError\u003e {\n        match self.get_pool() {\n            Some(pool) =\u003e {\n                let mut tx = pool.begin().await.map_err(|e| {\n                    GetDailyAlertsError::DatabaseConnectionError(format!(\n                        \"failed to begin database transaction: {}\",\n                        e\n                    ))\n                })?;\n\n                let total: (i64,) = sqlx::query_as(\n                    r#\"\n                    SELECT COUNT(*) FROM (\n                      SELECT\n                        alert.*, ROW_NUMBER()\n                      OVER (\n                        PARTITION BY\n                            `identifier`\n                        ORDER BY\n                            `sent`\n                        DESC\n                      ) AS rn\n                      FROM\n                        Alerts AS alert\n                      WHERE\n                        `sent` \u003e= CURDATE()\n                        AND `sent` \u003c CURDATE() + INTERVAL 1 DAY\n                    ) AS ranked\n                    WHERE\n                        rn = 1\n                        AND\n                        `msgtype` != \"Cancel\"\n                    \"#,\n                )\n                .fetch_one(\u0026mut *tx)\n                .await\n                .map_err(|e| {\n                    GetDailyAlertsError::DatabaseConnectionError(format!(\n                        \"failed to count daily alert items: {}\",\n                        e\n                    ))\n                })?;\n\n                let alert_items = sqlx::query_as::\u003c_, MySqlAlert\u003e(\n                    r#\"\n                    WITH ranked_alerts AS (\n                      SELECT\n                        alert.*, ROW_NUMBER()\n                      OVER (\n                        PARTITION BY\n                            `identifier`\n                        ORDER BY\n                            `sent`\n                        DESC\n                      ) AS rn\n                      FROM\n                        Alerts AS alert\n                      WHERE\n                        `sent` \u003e= CURDATE()\n                        AND `sent` \u003c CURDATE() + INTERVAL 1 DAY\n                    )\n                    SELECT\n                        `identifier`,\n                        `sender`,\n                        `sent`,\n                        `status`,\n                        `msgtype`,\n                        `source`,\n                        `scope`,\n                        `references`\n                    FROM\n                        ranked_alerts\n                    WHERE\n                        rn = 1\n                        AND\n                        `msgtype` != \"Cancel\"\n                    ORDER BY\n                        `sent` DESC\n                    LIMIT\n                        ?\n                    OFFSET\n                        ?\n                    \"#,\n                )\n                .bind(limit as i64)\n                .bind(offset as i64)\n                .fetch_all(\u0026mut *tx)\n                .await\n                .map_err(|e| {\n                    GetDailyAlertsError::DatabaseConnectionError(format!(\n                        \"failed to retrieve daily alert items: {}\",\n   identifier: AlertIdentifier,\n    sender: AlertSender,\n    sent: AlertSent,\n    status: AlertStatus,\n    msg_type: AlertMsgType,\n    source: AlertSource,\n    scope: AlertScope,\n    references: AlertReferences,\n}\n\nimpl Alert {\n    /// Constructs an [`Alert`] from its eight required CAP fields.\n    ///\n    /// These form the fixed CAP 1.2 alert structure; each field is a distinct\n    /// validated newtype, so a builder or params struct would add indirection\n    /// without reducing real complexity.\n    #[allow(clippy::too_many_arguments)]\n    pub fn new(\n        identifier: AlertIdentifier,\n        sender: AlertSender,\n        sent: AlertSent,\n        status: AlertStatus,\n        msg_type: AlertMsgType,\n        source: AlertSource,\n        scope: AlertScope,\n        references: AlertReferences,\n    ) -\u003e Self {\n        Alert {\n            identifier,\n            sender,\n            sent,\n            status,\n            msg_type,\n            source,\n            scope,\n            references,\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use time::OffsetDateTime;\n\n    use crate::domain::alert::new_types::alert_references::ExtendedMessageIdentifier;\n\n    #[test]\n    fn test_alert_new() {\n        let identifier = AlertIdentifier::new(\"alert-123\".to_string()).unwrap();\n        let sender = AlertSender::new(\"Sender123\".to_string()).unwrap();\n        let sent = AlertSent::new(OffsetDateTime::now_utc()).unwrap();\n        let status = AlertStatus::new(\"Actual\".to_string()).unwrap();\n        let msg_type = AlertMsgType::new(\"Alert\".to_string()).unwrap();\n        let source = AlertSource::new(\"Weather Station 1\").unwrap();\n        let scope = AlertScope::new(\"Public\".to_string()).unwrap();\n        let reference =\n            ExtendedMessageIdentifier::new(\"Sender1,Alert123,2024-06-01T12:00:00-00:00\").unwrap();\n        let references = AlertReferences::new(vec![reference.clone()]).unwrap();\n\n        let alert = Alert::new(\n            identifier, sender, sent, status, msg_type, source, scope, references,\n        );\n\n        // Verify the constructed alert carries the expected fields via its Debug\n        // representation (no public getters exist yet).\n        let debug = format!(\"{:?}\", alert);\n        assert!(debug.contains(\"alert-123\"));\n        assert!(debug.contains(\"Sender123\"));\n        assert!(debug.contains(\"Actual\"));\n        assert!(debug.contains(\"Weather Station 1\"));\n        assert!(debug.contains(\"Public\"));\n    }\n}\n","traces":[{"line":31,"address":[17659872],"length":1,"stats":{"Line":1}}],"covered":1,"coverable":1},{"path":["/","home","shyuen","local_repos","personal","eas-weather-rs","src","lib","domain","alert","new_types","alert_identifier.rs"],"content":"use thiserror::Error;\n\n/// The identifier of the alert message (REQUIRED)\n/// (1) A number or string uniquely identifying this message, assigned by the sender.\n/// (2) MUST NOT include spaces, commas or restricted characters (\u003c and \u0026).\n#[derive(Clone, Debug, PartialEq, Eq, PartialOrd, Ord, Hash, serde::Serialize)]\npub struct AlertIdentifier(String);\n\n#[derive(Error, Debug)]\npub enum AlertIdentifierError {\n    #[error(\"alert identifier cannot be empty\")]\n    EmptyIdentifier,\n    #[error(\"alert identifier contains invalid characters\")]\n    InvalidFormat,\n}\n\nimpl AlertIdentifier {\n    pub fn new(identifier: String) -\u003e Result\u003cSelf, AlertIdentifierError\u003e {\n        let trimmed = identifier.trim();\n        // Validate according to the rules\n        if trimmed.is_empty() {\n            return Err(AlertIdentifierError::EmptyIdentifier);\n        }\n        if trimmed.contains(\u0026[' ', ',', '\u003c', '\u0026'][..]) {\n            return Err(AlertIdentifierError::InvalidFormat);\n        }\n        Ok(AlertIdentifier(identifier))\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn the AlertService\n        info!(\"Initializing AlertService\");\n\n        Self {\n            db_port: db_port.clone(),\n        }\n    }\n\n    /// Get the Database repository\n    pub fn get_db_port(\u0026self) -\u003e \u0026D {\n        \u0026self.db_port\n    }\n\n    /// Retrieve the latest alerts sent within the last 24 hours from the database.\n    pub async fn get_daily_alerts(\n        \u0026self,\n        limit: u64,\n        offset: u64,\n    ) -\u003e Result\u003cGetDailyAlertsResponse, GetDailyAlertsError\u003e {\n        debug!(\"get_daily_alerts(limit={}, offset={})\", limit, offset);\n        match self.db_port.get_daily_alerts_data(limit, offset).await {\n            Ok(resp) =\u003e {\n                info!(\n                    \"get_daily_alerts returned {} of {} alerts\",\n                    resp.alerts.len(),\n                    resp.total\n                );\n                Ok(resp)\n            }\n            Err(err) =\u003e {\n                error!(\"get_daily_alerts failed: {}\", err);\n                Err(err)\n            }\n        }\n    }\n\n    /// Retrieve the latest alerts from the database.\n    pub async fn get_latest_alerts(\n        \u0026self,\n        limit: u64,\n        offset: u64,\n    ) -\u003e Result\u003cGetLatestAlertsResponse, GetLatestAlertsError\u003e {\n        debug!(\"get_latest_alerts(limit={}, offset={})\", limit, offset);\n        match self.db_port.get_latest_alerts_data(limit, offset).await {\n            Ok(resp) =\u003e {\n                info!(\n                    \"get_latest_alerts returned {} of {} alerts\",\n                    resp.alerts.len(),\n                    resp.total\n                );\n                Ok(resp)\n            }\n            Err(err) =\u003e {\n                error!(\"get_latest_alerts failed: {}\", err);\n                Err(err)\n            }\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::domain::database::service::DatabaseService;\n    use crate::test_support::{FailingDb, MockConfig, MockDb};\n\n    /// Build an `AlertService\u003cD\u003e` over the supplied `DatabasePort + AlertPort` double.\n    fn build_service\u003cD\u003e() -\u003e AlertService\u003cD\u003e\n    where\n        D: AlertPort + DatabasePort,\n    {\n        let conf_service = crate::domain::config::service::ConfigService {\n            port: MockConfig::new(),\n        };\n        let db_service = DatabaseService::\u003cD\u003e::new(\u0026conf_service);\n        AlertService::new(db_service)\n    }\n\n    #[tokio::test]\n    async fn get_latest_alerts_returns_port_data() {\n        let service = build_service::\u003cMockDb\u003e();\n        let resp = service.get_latest_alerts(10, 5).await.unwrap();\n        assert_eq!(resp.total, 42);\n        assert!(resp.alerts.is_empty());\n    }\n\n    #[tokio::test]\n    async fn get_latest_alerts_propagates_error() {\n        let service = build_service::\u003cFailingDb\u003e();\n        let result = service.get_latest_alerts(10, 5).await;\n        assert!(matches!(\n            result,\n            Err(GetLatestAlertsError::DatabaseError(msg)) if msg == \"test error\"\n        ));\n    }\n\n    #[tokio::test]\n    async fn get_daily_alerts_returns_port_data() {\n        let service = build_service::\u003cMockDb\u003e();\n        let resp = service.get_daily_alerts(10, 5).await.unwrap();\n        assert_eq!(resp.total, 42);\n        assert!(resp.alerts.is_empty());\n    }\n\n    #[tokio::test]\n    async fn get_daily_alerts_propagates_error() {\n        let service = build_service::\u003cFailingDb\u003e();\n        let result = service.get_daily_alerts(10, 5).await;\n        assert!(matches!(\n            result,\n            Err(GetDailyAlertsError::DatabaseError(msg)) if msg == \"test error\"\n        ));\n    }\n}\n","traces":[{"line":24,"address":[15677408,15675952,15678740,15677284],"length":1,"stats":{"Line":14}},{"line":25,"address":[16327977,16327914],"length":1,"stats":{ cret file).\n    LoadFailed {\n        /// Canonical `sector.field` key of the setting.\n        key: \u0026'static str,\n        /// The path/source that failed to load.\n        path: String,\n        /// The reason the load failed.\n        reason: String,\n        /// The default value used in place of the failed one.\n        default: String,\n    },\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","shyuen","local_repos","personal","eas-weather-rs","src","lib","domain","config","model.rs"],"content":"use serde::{Deserialize, Serialize};\n\n/// The raw configuration for the driver and its components.\n#[derive(Debug, Serialize, Deserialize, Clone)]\npub struct Config {\n    pub logging: ConfigLogging,\n    pub webserver: ConfigWebserver,\n    pub database: ConfigDatabase,\n    pub config_file: Option\u003cString\u003e,\n}\n\n/// The gathered, pre-validation configuration inputs, split by source.\n///\n/// Serialized to JSON values so the domain port stays decoupled from the\n/// adaptor-specific source types (e.g. the figment `Cli`). The config service\n/// decides how to render them (text vs JSON, masking).\n#[derive(Debug, Clone)]\npub struct RawConfigInputs {\n    /// Configuration sourced from CLI arguments.\n    pub cli: serde_json::Value,\n    /// Configuration sourced from environment variables.\n    pub env: serde_json::Value,\n    /// Configuration sourced from config files.\n    pub files: serde_json::Value,\n    /// The final merged raw configuration before validation.\n    pub final_config: serde_json::Value,\n}\n\n/// The raw configuration for logging.\n#[derive(Debug, Serialize, Deserialize, Clone)]\npub struct ConfigLogging {\n    pub format: Option\u003cString\u003e,\n    pub trace_level: Option\u003cString\u003e,\n}\n\n/// The raw configuration for the databse and its components.\n#[derive(Debug, Serialize, Deserialize, Clone)]\npub struct ConfigDatabase {\n    pub conn_url_file: Option\u003cString\u003e,\n    pub conn_max_retries: Option\u003cu8\u003e,\n    pub conn_retry_init_delay_secs: Option\u003cu16\u003e,\n\n    pub conn_acquire_timeout_secs: Option\u003cu16\u003e,\n    pub conn_idle_timeout_secs: Option\u003cu32\u003e,\n    pub conn_max_lifetime_secs: Option\u003cu32\u003e,\n    pub max_connections: Option\u003cu32\u003e,\n    pub min_connections: Option\u003cu32\u003e,\n}\n\n/// The raw configuration for the server and its components.\n#[derive(Debug, Serialize, Deserialize, Clone)]\npub struct ConfigWebserver {\n    pub hostname: Option\u003cString\u003e,\n    pub port: Option\u003cu16\u003e,\n    pub base_path: Option\u003cString\u003e,\n\n    pub shutdown_timeout_secs: Option\u003cu64\u003e,\n\n    pub api_key_file: Option\u003cString\u003e,\n\n    pub jwt_key_file: Option\u003cString\u003e,\n    pub jwt_access_token_expiry_secs: Option\u003cu64\u003e,\n\n    pub default_page_limit: Option\u003cu64\u003e,\n    pub page_limit_max: Option\u003cu64\u003e,\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","shyuen","local_repos","personal","eas-weather-rs","src","lib","domain","config","port.rs"],"content":"use crate::domain::config::issue::ConfigIssue;\nuse crate::domain::config::model::{Config, RawConfigInputs};\nuse crate::domain::database::model::Database;\nuse crate::domain::logging::model::Logging;\nuse crate::domain::webserver::model::Webserver;\n\npub trait ConfigPort: Clone + Send + Sync + 'static {\n    /// Generate and return the application configuration\n    /// Should gather configuration based on the priority order of:\n    /// CLI args \u003e Environment File \u003e Environment Variables \u003e Configuration File \u003e Default Configuration File \u003e Default Values\n    fn new() -\u003e Self;\n\n    /// Get the raw configuration\n    fn get_raw_config(\u0026self) -\u003e \u0026Config;\n\n    /// Get the logging configuration\n    fn get_logging_config(\u0026self) -\u003e \u0026Logging;\n\n    /// Get the database configuration\n    fn get_database_config(\u0026self) -\u003e \u0026Database;\n\n    /// Get the webserver configuration\n    fn get_webserver_config(\u0026self) -\u003e \u0026Webserver;\n\n    /// Gather the raw configuration inputs from each source (CLI, env, files)\n    /// without applying validation or auto-correction. Rendering/logging is\n    /// left to the caller so it can respect the configured output format.\n    fn raw_config_input(\u0026self) -\u003e RawConfigInputs;\n\n    /// Run validation over the effective configuration, collecting the issues\n    /// detected during any auto-correction. Emission into the logs is left to\n    /// the caller (the config service) so the domain models stay logging-free.\n    fn validate_raw_config(\u0026self) -\u003e Vec\u003cConfigIssue\u003e;\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","shyuen","local_repos","personal","eas-weather-rs","src","lib","domain","config","service.rs"],"content":"use tracing::{debug, info, trace, warn};\n\nuse crate::domain::config::adaptor_config::AdaptorConfigRepr;\nuse crate::domain::config::issue::ConfigIssue;\nuse crate::domain::config::model::Config;\nuse crate::domain::config::port::ConfigPort;\nuse crate::domain::database::model::Database;\nuse crate::domain::logging::model::Logging;\nuse crate::domain::logging::new_types::lg_format::LoggingFormatType;\nuse crate::domain::logging::port::LoggingPort;\nuse crate::domain::logging::service::LoggingService;\nuse crate::domain::webserver::model::Webserver;\n\n#[derive(Debug, Clone)]\npub struct ConfigService\u003cC\u003e\nwhere\n    C: ConfigPort,\n{\n    pub port: C,\n}\n\nimpl\u003cC\u003e Default for ConfigService\u003cC\u003e\nwhere\n    C: ConfigPort,\n{\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl\u003cC\u003e ConfigService\u003cC\u003e\nwhere\n    C: ConfigPort,\n{\n    /// Creates a new instance of ConfigService.\n    pub fn new() -\u003e Self {\n        let port = C::new();\n        Self { port }\n    }\n\n    /// Get the Config repository\n    pub fn get_port(\u0026self) -\u003e \u0026C {\n        \u0026self.port\n    }\n\n    /// Log the raw configuration inputs gathered from each source.\n    ///\n    /// Rendering depends on the configured logging format (pretty for text,\n    /// compact JSON for the json format). Emitted at `debug` since the raw,\n    /// pre-correction inputs are only of interest when troubleshooting config\n    /// auto-correction.\n    pub fn log_raw_config_input(\u0026self) {\n        let inputs = self.port.raw_config_input();\n        let pretty = matches!(\n            self.get_logging_config().format.get(),\n            LoggingFormatType::Text\n        );\n        let render = |value: \u0026serde_json::Value| -\u003e String {\n            if pretty {\n                serde_json::to_string_pretty(value).unwrap_or_else(|_| value.to_string())\n            } else {\n                value.to_string()\n            }\n        };\n\n        debug!(source = \"cli\", config = %render(\u0026inputs.cli));\n        debug!(source = \"env\", config = %render(\u0026inputs.env));\n        debug!(source = \"files\", config = %render(\u0026inputs.files));\n        debug!(source = \"final_config\", config = %render(\u0026inputs.final_config));\n    }\n\n    /// Emit the raw configuration through the initialized logging service.\n    ///\n    /// Must be called after [`LoggingService::new`] so tracing is active.\n    /// The `\u0026LoggingService` parameter enforces this ordering at compile time.\n    pub fn emit_raw_config\u003cL\u003e(\u0026self, _logging_service: \u0026LoggingService\u003cL\u003e)\n    where\n        L: LoggingPort,\n    {\n        let raw = serde_json::to_string_pretty(self.get_raw_config())\n            .unwrap_or_else(|_| \"failed to serialize config\".to_string());\n        info!(\"application configuration:\\n{raw}\");\n    }\n\n    /// Returns the raw configuration.\n    pub fn get_raw_config(\u0026self) -\u003e \u0026Config {\n        self.port.get_raw_config()\n    }\n\n    /// Log configuration fields exposed by an adaptor through [`AdaptorConfigRepr`].\n    ///\n    /// Emits one log line per adaptor, so N adaptors produce N lines at startup.\n    /// Rendering depends on the configured logging format:\n    /// - **text** → the fields are pretty-printed JSON, for convenient developer\n    ///   viewing.\n    /// - **json** → the fields are emitted as a compact JSON object, the\n    ///   machine-readable form suitable for log aggregators such as Splunk.\n    ///\n    /// Non-sensitive fields are logged at `info`; sensitive fields\n    /// (secrets/credentials) are withheld from info and only emitted at `trace`,\n    /// and even then in masked form (the adaptor supplies the masked\n    /// representation via its `Display`). Real secret values never enter the\n    /// logs.\n    pub fn log_adaptor_config(\u0026self, adaptor: \u0026impl AdaptorConfigRepr) {\n        let adaptor_name = adaptor.adaptor_name();\n        let mut public = serde_json::Map::new();\n        let mut secrets = serde_json::Map::new();\n        for field in adaptor.config_fields() {\n            let json = serde_json::Value::String(field.value);\n            if field.sensitive {\n                secrets.insert(field.key.to_string(), json);\n            } else {\n                public.insert(field.key.to_string(), json);\n            }\n        }\n\n        let pretty = matches!(\n            self.get_logging_config().format.get(),\n            LoggingFormatType::Text\n        );\n\n        if !public.is_empty() {\n            let config = serde_json::Value::Object(public);\n            if pretty {\n                info!(\n                    adaptor = adaptor_name,\n                    config = %serde_json::to_string_pretty(\u0026config).unwrap_or_else(|_| config.to_string())\n                );\n            } else {\n                info!(adaptor = adaptor_name, config = %config);\n            }\n        }\n        if !secrets.is ;\nuse crate::domain::database::model::Database;\nuse crate::domain::database::port::{DatabaseCloseError, DatabaseConnectError, DatabasePort};\nuse tracing::{debug, error, info, warn};\n\n#[derive(Debug, Clone)]\npub struct DatabaseService\u003cD\u003e\nwhere\n    D: DatabasePort + AlertPort,\n{\n    db_port: D,\n    conf: Database,\n}\n\nimpl\u003cD\u003e DatabaseService\u003cD\u003e\nwhere\n    D: DatabasePort + AlertPort,\n{\n    /// Creates a new instance of DatabaseService.\n    pub fn new\u003cC\u003e(conf_serv: \u0026ConfigService\u003cC\u003e) -\u003e Self\n    where\n        C: ConfigPort,\n    {\n        let conf = conf_serv.get_database_config().clone();\n        let db_port = D::new(\u0026conf);\n        Self { db_port, conf }\n    }\n\n    /// Get the Database port\n    pub fn get_port(\u0026self) -\u003e \u0026D {\n        \u0026self.db_port\n    }\n\n    pub async fn create_pool(\u0026mut self) -\u003e Result\u003c(), DatabaseConnectError\u003e {\n        let max_retries = self.conf.conn_max_retries.get();\n        let mut current_backoff = self.conf.conn_retry_init_delay_secs.get();\n\n        debug!(\n            \"create_pool: creating database connection pool (max_retries={})\",\n            max_retries\n        );\n\n        for attempt in 1..=max_retries {\n            match self.db_port.create_pool().await {\n                Ok(()) =\u003e {\n                    info!(\n                        attempt,\n                        \"create_pool: database connection pool created successfully\"\n                    );\n                    return Ok(());\n                }\n                Err(DatabaseConnectError::Fatal(msg)) =\u003e {\n                    error!(attempt, error = %msg, \"create_pool: fatal error; aborting\");\n                    return Err(DatabaseConnectError::Fatal(msg));\n                }\n                Err(DatabaseConnectError::Retryable(msg)) =\u003e {\n                    if attempt == max_retries {\n _string.to_string() == \"None\" {\n        return serializer.serialize_none();\n    }\n\n    serializer.serialize_str(\u0026conn_string.to_string())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use serde::Serialize;\n\n    #[derive(Serialize)]\n    struct Wrapper\u003c'a\u003e {\n        #[serde(serialize_with = \"serialize_with_display\")]\n        value: \u0026'a Wrapped,\n    }\n\n    #[derive(Debug)]\n    enum Wrapped {\n        Some(String),\n        None,\n    }\n\n    impl std::fmt::Display for Wrapped {\n        fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n            match self {\n                Wrapped::Some(s) =\u003e write!(f, \"{}\", s),\n                Wrapped::None =\u003e write!(f, \"None\"),\n            }\n        }\n    }\n\n    #[test]\n    fn test_capitalize_first_lowercase_rest() {\n        assert_eq!(\n            capitalize_first_lowercase_rest(\"hELLo WORld\"),\n            \"Hello world\"\n        );\n        assert_eq!(capitalize_first_lowercase_rest(\"RUST\"), \"Rust\");\n        assert_eq!(capitalize_first_lowercase_rest(\"rust\"), \"Rust\");\n        assert_eq!(capitalize_first_lowercase_rest(\"r\"), \"R\");\n        assert_eq!(capitalize_first_lowercase_rest(\"\"), \"\");\n    }\n\n    #[test]\n    fn serialize_with_display_writes_display_string() {\n        let wrapped = Wrapped::Some(\"mysql://user@db/app\".to_string());\n        let json = serde_json::to_string(\u0026Wrapper { value: \u0026wrapped }).unwrap();\n        assert_eq!(json, r#\"{\"value\":\"mysql://user@db/app\"}\"#);\n    }\n\n    #[test]\n    fn serialize_with_display_maps_none_to_null() {\n        let wrapped = Wrapped::None;\n        let json = serde_json::to_string(\u0026Wrapper { value: \u0026wrapped }).unwrap();\n        assert_eq!(json, r#\"{\"value\":null}\"#);\n    }\n}\n","traces":[{"line":1,"address":[16521817,16521488,16521811],"length":1,"stats":{"Line":1}},{"line":3,"address":[17918897],"length _hostname::WebserverHostname;\nuse crate::domain::webserver::new_types::ws_jwt_access_token_expiry_secs::WebserverJwtAccessTokenExpirySecs;\nuse crate::domain::webserver::new_types::ws_jwt_key::WebserverJwtKey;\nuse crate::domain::webserver::new_types::ws_jwt_key::WebserverJwtKeyError;\nuse crate::domain::webserver::new_types::ws_page_limit_max::WebserverPageLimitMax;\nuse crate::domain::webserver::new_types::ws_port::WebserverPort;\nuse crate::domain::webserver::new_types::ws_shutdown_timeout_secs::WebserverShutdownTimeoutSecs;\n\n/// Why the web server stopped, reported back to the caller so it can log the\n/// shutdown appropriately without the adaptor owning the logging.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ShutdownReason {\n    /// Received SIGINT (Ctrl+C).\n    CtrlC,\n    /// Received a terminate signal (SIGTERM on Unix).\n    Terminate,\n    /// The server stopped without a signal being received.\n    Stopped,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Webserver {\n    pub hostname: WebserverHostname,\n    pub port: WebserverPort,\n    pub base_path: WebserverBasePath,\n\n    pub shutdown_timeout_secs: WebserverShutdownTimeoutSecs,\n\n    #[serde(serialize_with = \"serialize_with_display\")]\n    pub api_key: WebserverApiKey,\n\n    #[serde(serialize_with = \"serialize_with_display\")]\n    pub jwt_key: WebserverJwtKey,\n    pub jwt_access_token_expiry_secs: WebserverJwtAccessTokenExpirySecs,\n\n    pub default_page_limit: WebserverDefaultPageLimit,\n    pub page_limit_max: WebserverPageLimitMax,\n}\n\nimpl Webserver {\n    // Creates a new instance of Webserver configuration.\n    pub fn new(conf: \u0026ConfigWebserver) -\u003e Self {\n        let hostname = match \u0026conf.hostname {\n            Some(raw_hostname) =\u003e WebserverHostname::new(raw_hostname)\n                .unwrap_or_else(|_| WebserverHostname::default()),\n            None =\u003e WebserverHostname::default(),\n        };\n\n        let port = ver;\n\n#[derive(Debug, Clone)]\npub struct ConfigFigment {\n    conf_raw: Config,\n    conf_logging: Logging,\n    conf_database: Database,\n    conf_webserver: Webserver,\n}\n\nfn collect_raw_input() -\u003e Config {\n    // This line loads the environment variables from the \".env\" file.\n    dotenv().ok();\n\n    // Use Figment to load preliminary configuration\n    // We need this to handle the certain configuration options such as using a\n    // different configuration file to load when dictated by the CLI or ENV.\n    let conf: Config = match Figment::new()\n        .join(Serialized::defaults(Cli::parse()))\n        .join(Env::prefixed(\"APP__\").split(\"__\"))\n        .extract()\n    {\n        Ok(c) =\u003e c,\n        Err(e) =\u003e {\n            eprintln!(\"error extracting configuration: {}\", e);\n            std::process::exit(1); // We use exit for planned exits instead of panics\n        }\n    };\n\n    // Check which selected config file to load from CLI or ENV\n    let config_file = match conf.config_file {\n        Some(x) =\u003e x.to_string(),\n        None =\u003e \"config/config.toml\".to_string(),\n    };\n\n    // Use Figment to load configuration from multiple sources the following priority\n    // CLI \u003e ENV \u003e FILE \u003e DEFAULT FILE \u003e CODE\n    let conf: Config = match Figment::new()\n        .join(Serialized::defaults(Cli::parse()))\n        .join(Env::prefixed(\"LOGGING__\").split(\"__\"))\n        .join(Env::prefixed(\"SERVER__\").split(\"__\"))\n        .join(Env::prefixed(\"DATABASE__\").split(\"__\"))\n        .join(Toml::file(config_file))\n        .join(Toml::file(\"./config/default.toml\"))\n        .extract()\n    {\n        Ok(c) =\u003e c,\n        Err(e) =\u003e {\n            eprintln!(\"error extracting configuration: {}\", e);\n            std::process::exit(1);\n        }\n    };\n\n    conf\n}\n\nimpl ConfigPort for ConfigFigment {\n    fn new() -\u003e Self {\n        let conf = collect_raw_input();\n        Self {\n            conf_raw: conf.clone(),\n            conf_logging: Logging::new(\u0026conf.logging),\n            conf_database: Database::new(\u0026conf.database),\n            conf_webserver: Webserver::new(\u0026conf.webserver),\n        }\n    }\n\n    /// Get the raw configuration\n    fn get_raw_config(\u0026self) -\u003e \u0026Config {\n        \u0026self.conf_raw\n    }\n\n    /// Get the logging configuration\n    fn get_logging_config(\u0026self) -\u003e \u0026Logging {\n        \u0026self.conf_logging\n    }\n\n    /// Get the database configuration\n    fn get_database_config(\u0026self) -\u003e \u0026Database {\n        \u0026self.conf_database\n    }\n\n    /// Get the webserver configuration\n    fn get_webserver_config(\u0026self) -\u003e \u0026Webserver {\n        \u0026self.conf_webserver\n    }\n\n    // Gather raw config input from each source without validation\n    fn raw_config_input(\u0026self) -\u003e RawConfigInputs {\n        // Gather config from CLI\n        let cli = serde_json::to_value(Cli::parse()).unwrap_or(serde_json::Value::Null);\n\n        // Gather config from ENV\n        let env = serde_json::to_value(\n            env::vars()\n                .filter(|(k, _)| {\n                    k.starts_with(\"LOGGING__\")\n                        || k.starts_with(\"SERVER__\")\n                        || k.starts_with(\"DATABASE__\")\n                })\n                .map(|(k, v)| (k.replace(\"__\", \".\"), v))\n                .collect::\u003cVec\u003c_\u003e\u003e(),\n        )\n        .unwrap_or(serde_json::Value::Null);\n\n        // Gather config from files\n        let files: Config = match Figment::new()\n            .join(Toml::file(\n                self.conf_raw\n                    .config_file\n                    .clone()\n                    .unwrap_or(\"config/config.toml\".to_string()),\n            ))\n            .join(Toml::file(\"./config/default.toml\"))\n            .extract()\n        {\n            Ok(c) =\u003e c,\n            Err(e) =\u003e {\n                eprintln!(\"error extracting configuration: {}\", e);\n                std::process::exit(1);\n            }\n        };\n        let files = serde_json::to_value(files).unwrap_or(serde_json::Value::Null);\n\n        // Final merged raw config before validation\n        let final_config = serde_json::to_value(\u0026self.conf_raw).unwrap_or(serde_json::Value::Null);\n\n        RawConfigInputs {\n            cli,\n            env,\n            files,\n            final_config,\n        }\n    }\n\n    /// Run validation over the effective configuration, collecting detected issues\n    fn validate_raw_config(\u0026self) -\u003e Vec\u003cConfigIssue\u003e {\n        let mut issues = Vec::new();\n        issues.extend(\n            self.conf_logging\n                .validate_raw_config(\u0026self.conf_raw.logging),\n        );\n        issues.extend(\n            self.conf_database\n                .validate_raw_config(\u0026self.conf_raw.database),\n        );\n        issues.extend(\n            self.conf_webserver\n                .validate_raw_config(\u0026self.conf_raw.webserver),\n        );\n        issues\n    }\n}\n","traces":[{"line":25,"address":[17911653,17909072,17911647],"length":1,"stats":{"Line":0}},{"line":27,"address":[15828416],"length":1,"stats":{"Line":0}},{"line":32,"address":[17909247,17909366,17909543,17909672],"length":1,"stats":{"Line":0}},{"line":33,"address":[17909272,17909374,17912215,17909291],"length":1,"stats":{"Line":0}},{"line":34,"address":[17912193,17909551,17909463,17909432],"length":1,"stats":{"Line":0}},{"line":35,"address":[17909601],"length":1,"stats":{"Line":0}},{"line":37,"address":[17909756],"length":1,"stats":{"Line":0}},{"line":38,"address":[17909686],"length":1,"stats":{"Line":0}},{"line":39,"address":[17912103,17909726],"length":1,"stats":{"Line":0}},{"line":40,"address":[17912174],"length":1,"stats":{"Line":0}},{"line":45,"address":[17909897],"length":1,"s    config: \u0026Webserver,\n        alert_service: \u0026AlertService\u003cD\u003e,\n        meta_serv: \u0026impl MetaPort,\n    ) -\u003e Result\u003cShutdownReason, std::io::Error\u003e\n    where\n        D: DatabasePort + AlertPort,\n    {\n        // Construct root address\n        let root_addr = format!(\"{}:{}\", config.hostname.get(), config.port.get());\n\n        // Check the base_path value\n        let base_path: \u0026str = match \u0026config.base_path.get() {\n            Some(base_path) =\u003e {\n                let mut clean_base_path = base_path.to_string();\n\n                // Ensure it begins with `/`\n                if !base_path.starts_with(\"/\") {\n                    clean_base_path = \"/\".to_string() + \u0026clean_base_path;\n                };\n\n                \u0026clean_base_path.to_string()\n            }\n            None =\u003e \"/\",\n        };\n\n        // Construct base address for OpenAPI server\n        let base_addr = format!(\"{}{}\", root_addr, base_path);\n\n        // Configure OpenAPI service\n        let main_paths = OpenApiService::new(\n            MetaHandler,\n            env!(\"CARGO_PKG_NAME\").to_string(),\n            env!(\"CARGO_PKG_VERSION\").to_string(),\n        )\n        .server(format!(\"http://{}\", base_addr));\n\n        // Create Swagger UI\n        let ui = main_paths.swagger_ui();\n\n        // Construct dependencies to inject into handlers.\n        let app_state = AppState {\n            meta: Arc::new(meta_serv.clone()),\n            moose: \"string\".to_string(),\n        };\n\n        // Create routes\n        let routes = Route::new()\n            .nest(\"/\", main_paths)\n            .nest(format!(\"{}/docs\", base_path), ui)\n            .data(app_state.clone()); // Pass meta_service to the routes, requires EndpointExt\n\n        // Database port for graceful shutdown is sourced from the alert service.\n        let db_port = alert_service.get_db_port().clone();\n\n        // Channe ew_types::alert_msg_type::AlertMsgType;\nuse crate::domain::alert::new_types::alert_references::AlertReferences;\nuse crate::domain::alert::new_types::alert_references::ExtendedMessageIdentifier;\nuse crate::domain::alert::new_types::alert_scope::AlertScope;\nuse crate::domain::alert::new_types::alert_sender::AlertSender;\nuse crate::domain::alert::new_types::alert_sent::AlertSent;\nuse crate::domain::alert::new_types::alert_source::AlertSource;\nuse crate::domain::alert::new_types::alert_status::AlertStatus;\nuse crate::domain::alert::port::AlertPort;\nuse crate::domain::alert::port::{\n    GetDailyAlertsError, GetDailyAlertsResponse, GetLatestAlertsError, GetLatestAlertsResponse,\n};\n\nuse sqlx::FromRow;\nuse time::OffsetDateTime;\nuse time::format_description::well_known::{Iso8601, iso8601, iso8601::TimePrecision};\n\n// Create custom marco to handle format\ntime::serde::format_description!(\n    my_iso8601_format, // Name of the generated module\n    OffsetDateTime,    // The type you are serializing\n    FORMAT             // The format constant defined above\n);\n\n// Define the desired format configuration\n// This is because the default serde implementation for ISO 8601 uses a 6-digit year format\nconst FORMAT: Iso8601\u003c\n    {\n        iso8601::Config::DEFAULT\n            .set_year_is_six_digits(false) // Disable default 6 digit year format\n            .set_time_precision(TimePrecision::Second {\n                decimal_digits: None, //To specify exactly X digits (microseconds) return Some(NonZeroU8::new(X).expect(\"X is not zero\")),\n            })\n            .encode()\n    },\n\u003e = Iso8601;\n\n/// A database row representing an alert, mapped from the MySQL alerts table.\n#[derive(\n    FromRow,\n    Debug,\n    Clone,\n    PartialEq,\n    Eq,\n    PartialOrd,\n    Ord,\n    Hash,\n    serde::Serialize,\n    serde::Deserialize,\n    sqlx::Type,\n)]\npub struct MySqlAlert {\n    pub identifier: String,\n    pub sender: String,\n    //pub sent: String,\n    #[serde(with = \"my_iso8601_format\")]\n    pub sent: OffsetDateTime,\n    pub status: String,\n    pub msgtype: String,\n    pub source: Option\u003cString\u003e,\n    pub scope: String,\n    pub references: Option\u003cString\u003e,\n}\n\nimpl AlertPort for DatabaseMySql {\n    async fn get_daily_alerts_data(\n        \u0026self,\n        limit: u64,\n        offset: u64,\n    ) -\u003e Result\u003cGetDailyAlertsResponse, GetDailyAlertsError\u003e {\n        match self.get_pool() {\n            Some(pool) =\u003e {\n                let mut tx = pool.begin().await.map_err(|e| {\n                    GetDailyAlertsError::DatabaseConnectionError(format!(\n                        \"failed to begin database transaction: {}\",\n                        e\n                    ))\n                })?;\n\n                let total: (i64,) = sqlx::query_as(\n                    r#\"\n                    SELECT COUNT(*) FROM (\n                      SELECT\n                        alert.*, ROW_NUMBER()\n                      OVER (\n                        PARTITION BY\n                            `identifier`\n                        ORDER BY\n                            `sent`\n                        DESC\n                      ) AS rn\n                      FROM\n                        Alerts AS alert\n                      WHERE\n                        `sent` \u003e= CURDATE()\n                        AND `sent` \u003c CURDATE() + INTERVAL 1 DAY\n                    ) AS ranked\n                    WHERE\n                        rn = 1\n                        AND\n                        `msgtype` != \"Cancel\"\n                    \"#,\n                )\n                .fetch_one(\u0026mut *tx)\n                .await\n                .map_err(|e| {\n                    GetDailyAlertsError::DatabaseConnectionError(format!(\n                        \"failed to count daily alert items: {}\",\n                        e\n                    ))\n                })?;\n\n                let alert_items = sqlx::query_as::\u003c_, MySqlAlert\u003e(\n                    r#\"\n                    WITH ranked_alerts AS (\n                      SELECT\n                        alert.*, ROW_NUMBER()\n                      OVER (\n                        PARTITION BY\n                            `identifier`\n                        ORDER BY\n                            `sent`\n                        DESC\n                      ) AS rn\n                      FROM\n                        Alerts AS alert\n                      WHERE\n                        `sent` \u003e= CURDATE()\n                        AND `sent` \u003c CURDATE() + INTERVAL 1 DAY\n                    )\n                    SELECT\n                        `identifier`,\n                        `sender`,\n                        `sent`,\n                        `status`,\n                        `msgtype`,\n                        `source`,\n                        `scope`,\n                        `references`\n                    FROM\n                        ranked_alerts\n                    WHERE\n                        rn = 1\n                        AND\n                        `msgtype` != \"Cancel\"\n                    ORDER BY\n                        `sent` DESC\n                    LIMIT\n                        ?\n                    OFFSET\n                        ?\n                    \"#,\n                )\n                .bind(limit as i64)\n                .bind(offset as i64)\n                .fetch_all(\u0026mut *tx)\n                .await\n                .map_err(|e| {\n                    GetDailyAlertsError::DatabaseConnectionError(format!(\n                        \"failed to retrieve daily alert items: {}\",\n                        e\n                    ))\n                })?;\n\n                tx.commit().await.map_err(|e| {\n                    GetDailyAlertsError::DatabaseConnectionError(format!(\n                        \"failed to commit database transaction: {}\",\n                        e\n                    ))\n                })?;\n\n                let alerts: Result\u003cVec\u003c_\u003e, _\u003e =\n                    alert_items.into_iter().map(Alert::try_from).collect();\n\n                match alerts {\n                    Ok(alerts) =\u003e Ok(GetDailyAlertsResponse {\n                        total: total.0 as u64,\n                        alerts,\n                    }),\n                    Err(errors) =\u003e {\n                        let error_msg = errors.join(\"; \");\n                        Err(GetDailyAlertsError::DataConversionError(error_msg))\n                    }\n                }\n            }\n\n            None =\u003e Err(GetDailyAlertsError::DatabaseConnectionError(\n                \"connection pool to MySQL is not initialized\".to_string(),\n            )),\n        }\n    }\n\n    async fn get_latest_alerts_data(\n        \u0026self,\n        limit: u64,\n        offset: u64,\n    ) -\u003e Result\u003cGetLatestAlertsResponse, GetLatestAlertsError\u003e {\n        match self.get_pool() {\n            Some(pool) =\u003e {\n                let mut tx = pool.begin().await.map_err(|e| {\n                    GetLatestAlertsError::DatabaseConnectionError(format!(\n                        \"failed to begin database transaction: {}\",\n                        e\n                    ))\n                })?;\n\n                let total: (i64,) = sqlx::query_as(\n                    r#\"\n                    SELECT COUNT(*) FROM (\n                      SELECT\n                        alert.*, ROW_NUMBER()\n                      OVER (\n                        PARTITION BY\n                            `identifier`\n                        ORDER BY\n                            `sent`\n                        DESC\n                      ) AS rn\n                      FROM\n                        Alerts AS alert\n                    ) AS ranked\n                    WHERE\n                        rn = 1\n                        AND\n                        `msgtype` != \"Cancel\"\n                    \"#,\n                )\n                .fetch_one(\u0026mut *tx)\n                .await\n                .map_err(|e| {\n                    GetLatestAlertsError::DatabaseConnectionError(format!(\n                        \"failed to count alert items: {}\",\n                        e\n                    ))\n                })?;\n\n                let alert_items = sqlx::query_as::\u003c_, MySqlAlert\u003e(\n                    r#\"\n                    WITH ranked_alerts AS (\n                      SELECT\n                        alert.*, ROW_NUMBER()\n                      OVER (\n                        PARTITION BY\n                            `identifier`\n                        ORDER BY\n                            `sent`\n                        DESC\n                      ) AS rn\n                      FROM\n                        Alerts AS alert\n                    )\n                    SELECT\n                        `identifier`,\n                        `sender`,\n                        `sent`,\n                        `status`,\n                        `msgtype`,\n                        `source`,\n                        `scope`,\n                        `references`\n                    FROM\n                        ranked_alerts\n                    WHERE\n                        rn = 1\n                        AND\n                        `msgtype` != \"Cancel\"\n                    ORDER BY\n                        `sent` DESC\n                    LIMIT\n                        ?\n                    OFFSET\n                        ?\n                    \"#,\n                )\n                .bind(limit as i64)\n                .bind(offset as i64)\n                .fetch_all(\u0026mut *tx)\n                .await\n                .map_err(|e| {\n                    GetLatestAlertsError::DatabaseConnectionError(format!(\n                        \"failed to retrieve alert items: {}\",\n                        e\n                    ))\n                })?;\n\n                tx.commit().await.map_err(|e| {\n                    GetLatestAlertsError::DatabaseConnectionError(format!(\n                        \"failed to commit database transaction: {}\",\n                        e\n                    ))\n                })?;\n\n                let alerts: Result\u003cVec\u003c_\u003e, _\u003e =\n                    alert_items.into_iter().map(Alert::try_from).collect();\n\n                match alerts {\n                    Ok(alerts) =\u003e Ok(GetLatestAlertsResponse {\n                        total: total.0 as u64,\n                        alerts,\n                    }),\n                    Err(errors) =\u003e {\n                        let error_msg = errors.join(\"; \");\n                        Err(GetLatestAlertsError::DataConversionError(error_msg))\n                    }\n                }\n            }\n            None =\u003e Err(GetLatestAlertsError::DatabaseConnectionError(\n                \"connection pool to MySQL is not initialized\".to_string(),\n            )),\n        }\n    }\n}\n\n/// Implement TryFrom to convert MySqlAlert to Alert, handling potential conversion errors\nimpl TryFrom\u003cMySqlAlert\u003e for Alert {\n    type Error = Vec\u003cString\u003e;\n\n    fn try_from(mysql_alert: MySqlAlert) -\u003e Result\u003cSelf, Self::Error\u003e {\n        let mut errors = Vec::new();\n\n        let identifier = AlertIdentifier::new(mysql_alert.identifier);\n        if identifier.is_err() {\n            errors.push(format!(\n                \"failed to create AlertIdentifier from MySqlAlert: {:?}\",\n                identifier.as_ref().err()\n            ));\n        }\n\n        let sender = AlertSender::new(mysql_alert.sender);\n        if sender.is_err() {\n            errors.push(format!(\n                \"failed to create AlertSender from MySqlAlert: {:?}\",\n                sender.as_ref().err()\n            ));\n        }\n\n        let sent = AlertSent::new(mysql_alert.sent);\n        if sent.is_err() {\n            errors.push(format!(\n                \"failed to create AlertSent from MySqlAlert: {:?}\",\n                sent.as_ref().err()\n            ));\n        }\n\n        let status = AlertStatus::new(mysql_alert.status);\n        if status.is_err() {\n            errors.push(format!(\n                \"failed to create AlertStatus from MySqlAlert: {:?}\",\n                status.as_ref().err()\n            ));\n        }\n\n        let msgtype = AlertMsgType::new(mysql_alert.msgtype);\n        if msgtype.is_err() {\n            errors.push(format!(\n                \"failed to create AlertMsgType from MySqlAlert: {:?}\",\n                msgtype.as_ref().err()\n            ));\n        }\n\n        let source = AlertSource::new(\u0026mysql_alert.source.unwrap_or_default());\n        if source.is_err() {\n            errors.push(format!(\n                \"failed to create AlertSource from MySqlAlert: {:?}\",\n                source.as_ref().err()\n            ));\n        }\n\n        let scope = AlertScope::new(mysql_alert.scope);\n        if scope.is_err() {\n            errors.push(format!(\n                \"failed to create AlertScope from MySqlAlert: {:?}\",\n                scope.as_ref().err()\n            ));\n        }\n\n        // Create AlertReferences from space-separated ExtendedMessageIdentifiers\n        let ext_msg_idents = match \u0026mysql_alert.references {\n            Some(refs) if !refs.is_empty() =\u003e {\n                let mut idents = Vec::new();\n                for raw in refs.split(' ') {\n                    match ExtendedMessageIdentifier::new(raw) {\n                        Ok(ident) =\u003e idents.push(ident),\n                        Err(e) =\u003e {\n                            errors.push(format!(\n                                \"failed to create ExtendedMessageIdentifier: {:?}\",\n                                e\n                            ));\n                            break;\n                        }\n                    }\n                }\n                idents\n            }\n            _ =\u003e Vec::new(),\n        };\n        if !errors.is_empty() {\n            return Err(errors);\n        }\n\n        let references = AlertReferences::new(ext_msg_idents);\n\n        Ok(Alert::new(\n            identifier.unwrap(),\n            sender.unwrap(),\n            sent.unwrap(),\n            status.unwrap(),\n            msgtype.unwrap(),\n            source.unwrap(),\n            scope.unwrap(),\n            references.unwrap(),\n        ))\n    }\n}\n","traces":[{"line":22,"address":[16414208,16414688,16414226,16414706],"length":1,"stats":{"Line":0}},{"line":69,"address":[17653984],"length":1,"stats":{"Line":0}},{"line":74,"address":[17512307,17512454],"length":1,"stats":{"Line":0}},{"line":75,"address":[17512487],"length":1,"stats":{"Line":0}},{"line":76,"address":[17510348,17512500,17512880,17513253,17512770,17513754,17510112,17512350],"length":1,"stats":{"Line":0}},{"line":77,"address":[17510134,17510199],"length":1,"stats":{"Line":0}},{"line":107,"address":[17513719,17513563,17513445,17513509,17513493],"length":1,"stats":{"Line":0}},{"line":108,"address":[17513775,17513699,17512365,17513959,17513598],"length":1,"stats":{"Line":0}},{"line":109,"address":[17511116,17510880,17514022],"length":1,"stats":{"Line":0}},{"line":110,"address":[17510967,17510902],"length":1,"stats":{"Line":0}},{"line":157,"address":[17514301],"length":1,"stats":{"Line":0}},{"line":158,"address":[17514337],"length":1,"stats":{"Line":0}},{"line":159,"address":[17514261,17514601,17514451,17514381,17514397],"length":1,"stats":{"Line":0}},{"line":160,"address":[17514486,17514657,17514581,17512380,17514841],"length":1,"stats":{"Line":0}},{"line":161,"address":[17510604,17510368,17514904],"length":1,"stats":{ pub alerts: Vec\u003cAlert\u003e,\n    pub total: u64,\n}\n// Latest Alerts\npub struct GetLatestAlertsResponse {\n    pub alerts: Vec\u003cAlert\u003e,\n    pub total: u64,\n}\n#[derive(Debug, Clone, PartialEq, Eq, Error)]\npub enum GetLatestAlertsError {\n    #[error(\"database error: {0}\")]\n    DatabaseError(String),\n    #[error(\"database error: {0}\")]\n    DatabaseConnectionError(String),\n    #[error(\"conversion error: {0}\")]\n    DataConversionError(String),\n}\n\n#[derive(Debug, Clone, PartialEq, Eq, Error)]\npub enum GetDailyAlertsError {\n    #[error(\"database error: {0}\")]\n    DatabaseError(String),\n    #[error(\"database error: {0}\")]\n    DatabaseConnectionError(String),\n    #[error(\"conversion error: {0}\")]\n    DataConversionError(String),\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","shyuen","local_repos","personal","eas-weather-rs","src","lib","domain","alert","service.rs"],"content":"use crate::domain::alert::port::{\n    AlertPort, GetDailyAlertsError, GetDailyAlertsResponse, GetLatestAlertsError,\n    GetLatestAlertsResponse,\n};\nuse crate::domain::database::port::DatabasePort;\nuse crate::domain::database::service::DatabaseService;\nuse tracing::{debug, error, info};\n\n/// The AlertService struct provides methods for managing alerts.\n/// Contains ports to interact with other services\n#[derive(Debug, Clone)]\npub struct AlertService\u003cD\u003e\nwhere\n    D: AlertPort + DatabasePort,\n{\n    db_port: D,\n}\n\nimpl\u003cD\u003e AlertService\u003cD\u003e\nwhere\n    D: AlertPort + DatabasePort,\n{\n    /// Creates a new instance of AlertService.\n    pub fn new(db_serv: DatabaseService\u003cD\u003e) -\u003e Self {\n        let db_port = db_serv.get_port();\n\n        // Log the initialization of the AlertService\n        info!(\"Initializing AlertService\");\n\n        Self {\n            db_port: db_port.clone(),\n        }\n    }\n\n    /// Get the Database repository\n    pub fn get_db_port(\u0026self) -\u003e \u0026D {\n        \u0026self.db_port\n    }\n\n    /// Retrieve the latest alerts sent within the last 24 hours from the database.\n    pub async fn get_daily_alerts(\n        \u0026self,\n        limit: u64,\n        offset: u64,\n    ) -\u003e Result\u003cGetDailyAlertsResponse, GetDailyAlertsError\u003e {\n        debug!(\"get_daily_alerts(limit={}, offset={})\", limit, offset);\n        match self.db_port.get_daily_alerts_data(limit, offset).await {\n            Ok(resp) =\u003e {\n                info!(\n                    \"get_daily_alerts returned {} of {} alerts\",\n                    resp.alerts.len(),\n                    resp.total\n                );\n                Ok(resp)\n            }\n            Err(err) =\u003e {\n                error!(\"get_daily_alerts failed: {}\", err);\n                Err(err)\n            }\n        }\n    }\n\n    /// Retrieve the latest alerts from the database.\n    pub async fn get_latest_alerts(\n        \u0026self,\n        limit: u64,\n        offset: u64,\n    ) -\u003e Result\u003cGetLatestAlertsResponse, GetLatestAlertsError\u003e {\n        debug!(\"get_latest_alerts(limit={}, offset={})\", limit, offset);\n        match self.db_port.get_latest_alerts_data(limit, offset).await {\n            Ok(resp) =\u003e {\n                info!(\n                    \"get_latest_alerts returned {} of {} alerts\",\n                    resp.alerts.len(),\n                    resp.total\n                );\n                Ok(resp)\n            }\n            Err(err) =\u003e {\n                error!(\"get_latest_alerts failed: {}\", err);\n                Err(err)\n            }\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::domain::database::service::DatabaseService;\n    use crate::test_support::{FailingDb, MockConfig, MockDb};\n\n    /// Build an `AlertService\u003cD\u003e` over the supplied `DatabasePort + AlertPort` double.\n    fn build_service\u003cD\u003e() -\u003e AlertService\u003cD\u003e\n    where\n        D: AlertPort + DatabasePort,\n    {\n        let conf_service = crate::domain::config::service::ConfigService {\n            port: MockConfig::new(),\n        };\n        let db_service = DatabaseService::\u003cD\u003e::new(\u0026conf_service);\n        AlertService::new(db_service)\n    }\n\n    #[tokio::test]\n    async fn get_latest_alerts_returns_port_data() {\n        let service = build_service::\u003cMockDb\u003e();\n        let resp = service.get_latest_alerts(10, 5).await.unwrap();\n        assert_eq!(resp.total, 42);\n        assert!(resp.alerts.is_empty());\n    }\n\n    #[tokio::test]\n    async fn get_latest_alerts_propagates_error() {\n        let service = build_service::\u003cFailingDb\u003e();\n        let result = service.get_latest_alerts(10, 5).await;\n        assert!(matches!(\n            result,\n            Err(GetLatestAlertsError::DatabaseError(msg)) if msg == \"test error\"\n        ));\n    }\n\n    #[tokio::test]\n    async fn get_daily_alerts_returns_port_data() {\n        let service = build_service::\u003cMockDb\u003e();\n        let resp = service.get_daily_alerts(10, 5).await.unwrap();\n        assert_eq!(resp.total, 42);\n        assert!(resp.alerts.is_empty());\n    }\n\n    #[tokio::test]\n    async fn get_daily_alerts_propagates_error() {\n        let service = build_service::\u003cFailingDb\u003e();\n        let result = service.get_daily_alerts(10, 5).await;\n        assert!(matches!(\n            result,\n            Err(GetDailyAlertsError::DatabaseError(msg)) if msg == \"test error\"\n        ));\n    }\n}\n","traces":[{"line":24,"address":[15616836,15615504,15616960,15618292],"length":1,"stats":{"Line":11}},{"line":25,"address":[16327977,16327914],"length":1,"stats":{"Line":16}},{"line":28,"address":[16327985,16328396],"length":1,"stats":{"Line":14}},{"line":31,"address":[16328386],"length":1,"stats":{"Line":3}},{"line":36,"address":[16327760],"length":1,"stats":{"Line":0}},{"line
