name: CI

on:
  push:
    branches: [main]
    # Workflow/docs-only changes don't produce a release candidate.
    paths-ignore:
      - README.md
      - .github/**
  pull_request:
    branches: [main]

# Mirrors `.gitlab-ci.yml` (check -> build) so the public GitHub mirror has the
# same guarantees as the private GitLab pipeline, plus a live-DB integration
# test job. The Rust toolchain comes from rust-toolchain.toml (read once in the
# `check` job, consumed everywhere), the same single source the Nix flake and
# Dockerfile use.
#
# Trunk-based release candidates: every merge to main is a candidate. `publish`
# builds the image, tags the codebase
# `<sha7>-<workflow>.<run>.<attempt>` (e.g. a1b2c3d-ab12.47.2), and
# auto-deploys to
# dev via GitOps (ArgoCD watching `eas-weather-rs-k8s`). Promoting an existing
# tag to staging/prod (and redeploying re-test builds to dev) is done through
# `deploy-tag-to-env.yml`.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The debug profile is used by clippy and test jobs. Skip emitting debug
  # info (not needed for lint/tests) which dramatically speeds up the debug
  # dependency compile; incremental builds thrash CI caches, so disable them
  # too. The build job keeps the full release profile so the deployable
  # binaries stay optimized.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_INCREMENTAL: false

jobs:
  check:
    name: Check (fmt, clippy, test)
    runs-on: ubuntu-latest
    # Single source of truth for the CI toolchain: rust-toolchain.toml is
    # shared by the Nix flake and the Dockerfile too. check parses it once and
    # every other job consumes it via needs.check.outputs.toolchain.
    outputs:
      toolchain: ${{ steps.toolchain.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned toolchain
        id: toolchain
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: check
      - run: cargo fetch
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --no-deps -- -D warnings
      - run: cargo test -- --test-threads=1

  coverage:
    name: Coverage (informational)
    needs: check
    runs-on: ubuntu-latest
    # Coverage is informational: generate a report artifact without gating the
    # workflow on a percentage. tarpaulin's LLVM engine needs the LLVM tools.
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.check.outputs.toolchain }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - run: cargo install cargo-tarpaulin --locked
      - run: cargo tarpaulin --engine llvm --out Html --output-dir coverage/html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/html/
          if-no-files-found: warn

  integration:
    name: Integration (live MariaDB)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Same base image/version as the local `compose.yaml` DB so the full API
    # stack is exercised against a real database. Tests apply migrations
    # themselves (idempotent) and clean up their rows.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eas_weather
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      EAS_WEATHER_RS_TEST_DB: mysql://root:root@localhost:3306/eas_weather
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.check.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: integration
      - run: cargo fetch
      - run: cargo test --test db_integration -- --ignored --test-threads=1

  build:
    name: Build (release binaries)
    needs: [check, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.check.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build
      - run: cargo fetch
      - run: cargo build --release --bin eas-weather-rs-server --bin eas-weather-rs-migrate
      - uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            target/release/eas-weather-rs-server
            target/release/eas-weather-rs-migrate
          if-no-files-found: warn

  publish:
    name: Publish dev image + update k8s overlay
    if: github.event_name == 'push'
    needs: [check, integration, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/shyuen/eas-weather-rs-server
      ENV: dev
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag
        id: tag
        env:
          SHA: ${{ github.sha }}
          WF: ${{ github.workflow_ref }}
        # A build's tag is environment-agnostic (the same image is promoted to
        # staging/prod). Naming: <sha7>-<workflow>.<run>.<attempt>, e.g.
        # a1b2c3d-ab12.47.2 — the commit is the ground-truth identity (never
        # stale the way a manually-bumped Cargo version can be), and the
        # pipeline id guarantees per-execution uniqueness: the 4-char workflow
        # hash guards against workflow-file renames (which reset the run
        # counter), and run_attempt covers re-runs that may rebuild later with
        # drifted base images. All chars are in the union charset of git refs
        # and docker tags (lowercase alnum . _ -). The Cargo version is kept as
        # an OCI image label, not in the tag.
        run: |
          WF_HASH=$(printf '%s' "${WF%@*}" | sha256sum | cut -c1-4)
          echo "image_tag=${SHA:0:7}-${WF_HASH}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Read Cargo version
        id: version
        run: echo "value=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.ENV }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      # Only reached if the image build/push succeeded above (steps fail fast);
      # a failed image publish never tags the codebase or touches the overlay.
      # Skip-if-exists is defense in depth (e.g. a re-run where the previous
      # attempt already pushed the git tag before failing later).
      - name: Tag codebase with image tag
        run: |
          git config user.name "eas-weather-rs CD"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${{ steps.tag.outputs.image_tag }}" >/dev/null; then
            echo "Tag ${{ steps.tag.outputs.image_tag }} already exists; nothing to push."
          else
            git tag -a "${{ steps.tag.outputs.image_tag }}" -m "Image tag ${{ steps.tag.outputs.image_tag }}"
            git push origin "refs/tags/${{ steps.tag.outputs.image_tag }}"
          fi

      - name: Check out deployment repo
        uses: actions/checkout@v7
        with:
          repository: shyuen/eas-weather-rs-k8s
          ref: main
          token: ${{ secrets.EWRS_DEPLOY_REPO_PAT }}
          path: k8s-repo

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update dev overlay image tag
        working-directory: k8s-repo
        env:
          KEY_PATH: .helmCharts[0].valuesInline.image.tag
        run: |
          yq -i "${KEY_PATH} = \"${{ steps.tag.outputs.image_tag }}\"" "overlays/${ENV}/kustomization.yaml"
          git diff -- "overlays/${ENV}/kustomization.yaml"

      - name: Commit and push overlay change
        working-directory: k8s-repo
        run: |
          git config user.name "eas-weather-rs CD"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "overlays/${ENV}/kustomization.yaml"
          if ! git diff-index --quiet HEAD; then
            git commit -m "Bump ${ENV} image tag to ${{ steps.tag.outputs.image_tag }}"
            git push origin main
          else
            echo "Overlay already at ${{ steps.tag.outputs.image_tag }}; nothing to commit."
          fi

      - name: Write job summary
        run: |
          {
            echo "## eas-weather-rs publish: \`${{ env.ENV }}\`"
            echo ""
            echo "- Image: \`${{ env.IMAGE }}\` tags \`${{ env.ENV }}\`, \`${{ steps.tag.outputs.image_tag }}\`"
            echo "- Codebase tag: \`${{ steps.tag.outputs.image_tag }}\`"
            echo "- Overlay updated: \`overlays/${{ env.ENV }}/kustomization.yaml\` → \`${{ steps.tag.outputs.image_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"