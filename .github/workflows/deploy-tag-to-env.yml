name: Deploy Built Tag to Environment

on:
  workflow_dispatch:
    inputs:
      env:
        description: >-
          Environment to update in eas-weather-rs-k8s. 'production' also names
          the GitHub environment whose protection rules gate the promotion. The
          input value dev/staging/production is the environment; the k8s overlay
          folder for production is `overlays/prod/`.
        type: choice
        options: [dev, staging, production]
        default: dev
      version:
        description: >-
          Image tag (== codebase Git tag minted by the CI publish job) to
          promote, e.g. b0b91f8-d183.26.1. Dispatch from any branch so the
          workflow itself resolves from the running ref; version pins what is
          deployed.
        type: string
        required: true

# Promotions are serialized per environment so two concurrent deployments of
# different tags to the same env can't race on the overlay file. A later
# dispatch cancels an in-progress one for the same env.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.env }}
  cancel-in-progress: true

# GitOps promotions: point the ArgoCD-watched `eas-weather-rs-k8s` overlay at
# an image already published by the CI `publish` job. Nothing is rebuilt and no
# git tag is created here — `version` names the tag the publish job minted AND
# the GHCR image tag. Releases only record codebase versions that passed through
# staging: dev redeploys touch no release, staging mints a prerelease on first
# promotion, and prod graduates that prerelease into a full release. Deploying
# a tag with no prior staging release (e.g. a rollback) never mints one.
#
# Token scopes: job permissions mirror `publish` (contents + packages) for the
# tag/overlay work. The release step additionally needs `workflows: write`,
# which GitHub's workflow-scope enforcement demands whenever the released
# history touches .github/workflows — a scope the GITHUB_TOKEN can never hold
# (there are no `releases`/`workflows` keys in its permissions block), so that
# one step gets a dedicated import PAT (EWRS_RELEASE_PAT).
permissions:
  contents: read

jobs:
  promote:
    name: Promote image to ${{ inputs.env }}
    runs-on: ubuntu-latest
    # Binding the promotion to its target environment gates staging/prod behind
    # the environment's protection rules (Settings > Environments > required
    # reviewers). The dev environment carries no rules, so dev stays automatic.
    # Every step runs only after the gate clears, and re-runs re-apply it.
    environment: ${{ inputs.env }}
    permissions:
      contents: write
      packages: read
    env:
      IMAGE: ghcr.io/shyuen/eas-weather-rs-server
      # ENV is the release/overlay key (dev/staging/prod); the GitHub
      # environment name for prod is 'production'.
      ENV: ${{ inputs.env == 'production' && 'prod' || inputs.env }}
      ENVIRONMENT_NAME: ${{ inputs.env }}
    steps:
      # Full history + tags are required so `gh release create --generate-notes`
      # can resolve the promoted tag and compute notes from git, and so the
      # version input can be validated against actual Git tags.
      - name: Check out codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9a-f]{7}-[0-9a-f]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like <sha7>-<workflow>.<run>.<attempt> (e.g. b0b91f8-d183.26.1)."
            exit 1
          fi
          if ! git tag --list "$VERSION" | grep -q "^$VERSION$"; then
            echo "::error::No Git tag '$VERSION' in this repository. Promote a tag minted by the publish job."
            exit 1
          fi
          echo "image_tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify image tag exists
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }}"

      - name: Check out deployment repo
        uses: actions/checkout@v7
        with:
          repository: shyuen/eas-weather-rs-k8s
          ref: main
          token: ${{ secrets.EWRS_DEPLOY_REPO_PAT }}
          path: k8s-repo

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update overlay image tag
        working-directory: k8s-repo
        env:
          KEY_PATH: .helmCharts[0].valuesInline.image.tag
        run: |
          yq -i "${KEY_PATH} = \"${{ steps.tag.outputs.image_tag }}\"" "overlays/${ENV}/kustomization.yaml"
          git diff -- "overlays/${ENV}/kustomization.yaml"

      - name: Commit and push overlay change
        working-directory: k8s-repo
        run: |
          git config user.name "eas-weather-rs CD"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "overlays/${ENV}/kustomization.yaml"
          if ! git diff-index --quiet HEAD; then
            git commit -m "Bump ${ENV} image tag to ${{ steps.tag.outputs.image_tag }}"
            git push origin main
          else
            echo "Overlay already at ${{ steps.tag.outputs.image_tag }}; nothing to commit."
          fi

      # Release lifecycle follows the pipeline, not the deployment. A release
      # exists only for versions that flowed through staging: first staging
      # promotion creates a prerelease, and prod graduates that prerelease into
      # a full release. Rolling back or deploying straight to prod never mints
      # a new release — such targets either already have one (history intact)
      # or get deployed without one, since they never passed through staging.
      - name: Guard release PAT
        env:
          GH_TOKEN: ${{ secrets.EWRS_RELEASE_PAT }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::EWRS_RELEASE_PAT is not set; the release step cannot run."
            echo "Create a fine-grained PAT on eas-weather-rs (Contents and Workflows: write) and store it under this name."
            exit 1
          fi

      - name: Create or promote GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.EWRS_RELEASE_PAT }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.image_tag }}"
          ENV="${{ inputs.env }}"
          REASON=""

          if [[ "$ENV" == "dev" ]]; then
            echo "reason=skipped-dev" >> "$GITHUB_OUTPUT"
            echo "Dev redeploys do not create or edit a GitHub release."
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Previously released (e.g. a staging prerelease, or an even older
            # full release being re-deployed as a rollback). History stays put.
            if [[ "$ENV" == "prod" ]]; then
              PRERELEASE=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
              if [[ "$PRERELEASE" == "true" ]]; then
                gh release edit "$TAG" --prerelease=false
                REASON="prerelease->full"
                echo "Graduated the staging prerelease into a full release."
              else
                REASON="already-released"
                echo "Tag already has a full release; leaving history as-is."
              fi
            else
              REASON="exists"
              echo "Release already exists for $TAG; leaving as-is."
            fi
          elif [[ "$ENV" == "staging" ]]; then
            gh release create "$TAG" \
              --prerelease \
              --generate-notes \
              --title "eas-weather-rs $TAG"
            REASON="created-prerelease"
          else
            echo "reason=no-release-deployed-only" >> "$GITHUB_OUTPUT"
            echo "No GitHub release created for $TAG: it never passed through staging."
            echo "Patch on main and promote dev > staging > prod to ship a new version."
            exit 0
          fi

          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "url=$(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_REASON: ${{ steps.release.outputs.reason }}
        run: |
          {
            echo "## eas-weather-rs promote: \`${{ env.ENVIRONMENT_NAME }}\`"
            echo ""
            echo "- Environment: \`${{ env.ENVIRONMENT_NAME }}\`"
            echo "- Image: \`${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }}\` (existing, no rebuild)"
            echo "- Overlay updated: \`overlays/${{ env.ENV }}/kustomization.yaml\` → \`${{ steps.tag.outputs.image_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${RELEASE_URL}" ]]; then
            echo "- GitHub release: ${RELEASE_URL} (\`${RELEASE_REASON}\`)" >> "$GITHUB_STEP_SUMMARY"
          fi