stages:
  - fmt
  - clippy
  - test
  - build

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Shared cache across the fmt/clippy/test/build jobs to avoid re-fetching deps.
cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/
    - target/

fmt:
  stage: fmt
  image: rust:1.85-bookworm
  script:
    - rustup component add rustfmt
    - cargo fmt --version
    - cargo fmt --all -- --check

clippy:
  stage: clippy
  image: rust:1.85-bookworm
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings

test:
  stage: test
  image: rust:1.85-bookworm
  script:
    - cargo test -- --test-threads=1

build:
  stage: build
  image: rust:1.85-bookworm
  script:
    - cargo build --release --bin eas-weather-rs-server --bin eas-weather-rs-migrate
  artifacts:
    paths:
      - target/release/eas-weather-rs-server
      - target/release/eas-weather-rs-migrate
    expire_in: 1 week
