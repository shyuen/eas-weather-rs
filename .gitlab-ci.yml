stages:
  - check
  - build

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The debug profile is used by clippy and test in the `check` stage. Skip
  # emitting debug info (not needed for lint/tests) which dramatically speeds
  # up the debug dependency compile; incremental builds thrash CI caches, so
  # disable them too. The `build` stage keeps the full release profile so the
  # deployable binaries stay optimized.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_INCREMENTAL: false

# Shared cache keyed on Cargo.lock so both jobs reuse the compiled dependency
# tree instead of rebuilding it from scratch on every run.
cache:
  key:
    files:
      - Cargo.lock
  paths:
    - .cargo/
    - target/

check:
  stage: check
  image: rust:1.85-bookworm
  script:
    - rustup component add rustfmt clippy
    - cargo fetch
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --no-deps -- -D warnings
    - cargo test -- --test-threads=1

build:
  stage: build
  image: rust:1.85-bookworm
  script:
    - cargo fetch
    - cargo build --release --bin eas-weather-rs-server --bin eas-weather-rs-migrate
  artifacts:
    paths:
      - target/release/eas-weather-rs-server
      - target/release/eas-weather-rs-migrate
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
