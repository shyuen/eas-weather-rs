[package]
name = "eas-weather-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "eas-weather-rs"
path = "src/bin/server/main.rs"

[lib]
name = "eas_weather_rs"
path = "src/lib/lib.rs"

[dependencies]
# Common dependencies
serde = "1.0.219"
serde_derive = "1"

# Adaptor dependencies
dotenv = "0.15.0"
clap = { version = "4.5.41", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
figment_file_env_provider = "0.2.0"
thiserror = "2.0"
strum = "0.27"
strum_macros = "0.27"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
