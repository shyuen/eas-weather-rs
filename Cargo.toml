[package]
name = "eas-weather-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "eas-weather-rs"
path = "src/bin/server/main.rs"

[lib]
name = "eas_weather_rs"
path = "src/lib/lib.rs"

[dependencies]
# Common dependencies
serde = "1.0.219"
serde_derive = "1"
time = { version = "0.3", features = ["macros", "serde", "formatting", "parsing"] }

# Adaptor dependencies
dotenv = "0.15.0"
clap = { version = "4.5.41", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
figment_file_env_provider = "0.2.0"
thiserror = "2.0"
strum = "0.27"
strum_macros = "0.27"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
sqlx = { version = "0.8", features = [ "mysql", "runtime-tokio", "time"] }
tokio = {version="1", features = ["macros", "rt-multi-thread", "signal"]}
poem = "3.1.12"
poem-openapi =  { version = "5", features = ["swagger-ui"] }
serde_json = "1.0"
axum = {version = "0.8.8"}
tower = "0.5.3"

[dev-dependencies]
http-body-util = "0.1"
